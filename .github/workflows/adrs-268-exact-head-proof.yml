name: ADRS 268 exact-head proof

on:
  pull_request:
    branches: [proposals]
    paths:
      - .github/workflows/adrs-268-exact-head-proof.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate ADRS reader identity
        env:
          CLIENT_ID: ${{ vars['ADRS_READER_CLIENT_ID'] }}
          PRIVATE_KEY: ${{ secrets['ADRS_READER_PRIVATE_KEY'] }}
        run: test -n "$CLIENT_ID" && test -n "$PRIVATE_KEY"
      - id: adrs-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars['ADRS_READER_CLIENT_ID'] }}
          private-key: ${{ secrets['ADRS_READER_PRIVATE_KEY'] }}
          owner: roccho-dev
          repositories: adrs
          permission-contents: read
      - uses: actions/checkout@v6
        with:
          repository: roccho-dev/adrs
          ref: 55c3843640fe02e8214dbda5a307b96a9d8ec2d2
          path: adrs
          token: ${{ steps.adrs-token.outputs.token }}
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@v3
      - name: Run exact semantic contract and canonical gates
        run: |
          set -euo pipefail
          mkdir -p proof
          test "$(git -C adrs rev-parse HEAD)" = 55c3843640fe02e8214dbda5a307b96a9d8ec2d2
          cd adrs
          python3 -S tools/check-diagram-semantic-contract-v1.py check --root . --out ../proof/check-a.json
          python3 -S tools/check-diagram-semantic-contract-v1.py check --root . --out ../proof/check-b.json
          cmp ../proof/check-a.json ../proof/check-b.json
          python3 -S tools/check-diagram-semantic-contract-v1.py selftest --root . --out ../proof/selftest-a.json
          python3 -S tools/check-diagram-semantic-contract-v1.py selftest --root . --out ../proof/selftest-b.json
          cmp ../proof/selftest-a.json ../proof/selftest-b.json
          cmp ../proof/selftest-a.json diagram_semantic_contract/v1/proof.json
          nix flake check -L |& tee ../proof/nix-flake-check.log
          cd ..
          python3 - <<'PY' > proof/summary.json
          import json
          v=json.load(open('proof/selftest-a.json'))
          assert v['status']=='PASS' and v['destructiveCaseCount']==10
          print(json.dumps({'kind':'adrs268ExternalExactHeadProof.v1','candidate':'55c3843640fe02e8214dbda5a307b96a9d8ec2d2','status':'PASS','destructiveCaseCount':10,'expectedSemanticContractAccepted':True,'implementationConformanceProven':False,'renderQualityProven':False,'publicationAdmissible':False,'authority':False},sort_keys=True,separators=(',',':')))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adrs-268-exact-head-proof
          path: proof
          if-no-files-found: error
