name: Temporary locate Ops final CI artifact

on:
  pull_request:
    branches: [proposals]
    paths:
      - .github/workflows/_temporary-locate-ops-final-ci-artifact.yml

permissions:
  contents: read

jobs:
  locate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Locate exact public Ops artifact
        run: |
          python3 - <<'PY'
          import json,urllib.request
          headers={'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'governance-artifact-locator'}
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=60) as r:return json.load(r)
          repo='roccho-dev/ops'; head='a622192703c53fea4890a3ad3618e2a0ac85032f'
          runs=get(f'https://api.github.com/repos/{repo}/actions/runs?branch=proposals&event=push&status=success&per_page=100')['workflow_runs']
          runs=[r for r in runs if r.get('head_sha')==head and r.get('name')=='final CI consumer' and r.get('conclusion')=='success']
          assert runs,runs
          run=max(runs,key=lambda r:int(r['id']))
          artifacts=get(f'https://api.github.com/repos/{repo}/actions/runs/{run["id"]}/artifacts?per_page=100')['artifacts']
          artifacts=[a for a in artifacts if a.get('name')=='final-ci-consumer-receipt' and not a.get('expired')]
          assert len(artifacts)==1,artifacts
          a=artifacts[0]
          open('ops-final-ci-artifact-identity.json','w').write(json.dumps({'repository':repo,'head':head,'runId':run['id'],'artifactId':a['id'],'artifactDigest':a['digest'],'authority':False},sort_keys=True,separators=(',',':'))+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: merged-ops-final-ci-artifact-identity
          path: ops-final-ci-artifact-identity.json
          if-no-files-found: error
