name: temporary apply issue 171 cwd

on:
  pull_request:
    branches:
      - proposals

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor == github.repository_owner }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Patch and create exact Git blob
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          parent_sha=$(git rev-parse HEAD)
          base_tree=$(git rev-parse HEAD^{tree})
          python3 tools/gov_release/patch_issue_171_cwd.py
          python3 - <<'PY' > blob-request.json
          import base64,json
          print(json.dumps({'content':base64.b64encode(open('.github/workflows/gov-release.yml','rb').read()).decode(),'encoding':'base64'},separators=(',',':')))
          PY
          blob=$(gh api --method POST "repos/$REPOSITORY/git/blobs" --input blob-request.json --jq .sha)
          python3 - <<PY
          import json
          value={'parentSha':'$parent_sha','baseTreeSha':'$base_tree','blob':'$blob'}
          open('git-data.json','w').write(json.dumps(value,sort_keys=True,separators=(',',':'))+'\n')
          print(json.dumps(value,sort_keys=True,separators=(',',':')))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: issue-171-cwd-git-data
          path: git-data.json
          if-no-files-found: error
