name: materialize-exact-candidate-governance

on:
  push:
    branches:
      - transport/gov-package-output-release-carry-260829
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-exact-candidate-governance
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Materialize exact candidate
        env:
          BASE_SHA: 9be6d7c1413b6c9ea15c06fbed2392f7fa64219b
          EXPECTED_TREE: aae076151f4c3b0758619c3e6202797ee04ab2b6
          ARCHIVE_SHA256: 7b150d32bc3d9c98373254532c76544e6d47d21e25a0e76c27d1aaf1e8a15aa2
          TARGET_BRANCH: feat/gov-release-package-output-transport-260829
          COMMIT_MESSAGE: "feat: carry exact gov package output in releases"
        run: |
          set -euo pipefail
          transport="$RUNNER_TEMP/materializer"
          mkdir -p "$transport"
          cp .materializer/part-*.txt "$transport/"
          cp .materializer/files.txt .materializer/delete.txt "$transport/"
          git cat-file -e "$BASE_SHA^{commit}"
          git reset --hard "$BASE_SHA"
          git clean -fdx
          cat "$transport"/part-*.txt | base64 -d > "$transport/changes.tar.xz"
          test "$(sha256sum "$transport/changes.tar.xz" | awk '{print $1}')" = "$ARCHIVE_SHA256"
          python3 - "$transport/changes.tar.xz" "$transport/files.txt" <<'PY2'
          import pathlib,sys,tarfile
          archive=pathlib.Path(sys.argv[1])
          expected=[line for line in pathlib.Path(sys.argv[2]).read_text().splitlines() if line]
          with tarfile.open(archive,'r:xz') as tf:
              names=[]
              for member in tf.getmembers():
                  p=pathlib.PurePosixPath(member.name)
                  if p.is_absolute() or '..' in p.parts or not member.isfile():
                      raise SystemExit(f'unsafe archive member: {member.name}')
                  names.append(member.name)
              if sorted(names)!=sorted(expected):
                  raise SystemExit(f'archive inventory mismatch: expected={expected} observed={names}')
              tf.extractall('.',filter='data')
          PY2
          while IFS= read -r path; do
            test -z "$path" || rm -f -- "$path"
          done < "$transport/delete.txt"
          git add -A
          observed_tree="$(git write-tree)"
          test "$observed_tree" = "$EXPECTED_TREE"
          python3 -m unittest discover -s tools/gov_release/tests -v
          python3 - <<'PY2'
          import json
          from pathlib import Path
          for line in Path('ci.intent.v1.jsonl').read_text().splitlines():
              if line.strip(): json.loads(line)
          PY2
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "$COMMIT_MESSAGE"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          {
            echo "base=$BASE_SHA"
            echo "tree=$EXPECTED_TREE"
            echo "commit=$(git rev-parse HEAD)"
            echo "target=$TARGET_BRANCH"
          } >> "$GITHUB_STEP_SUMMARY"
