name: Diagrams next source snapshot

on:
  pull_request:
    branches: [proposals]
    paths:
      - .github/workflows/diagrams-next-source.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          repository: roccho-dev/diagrams
          ref: a293e39890aee692f70d4e8d114d4081733a937b
          path: diagrams
          persist-credentials: false
      - name: Bind source and create deterministic archive
        run: |
          set -euo pipefail
          test "$(git -C diagrams rev-parse HEAD)" = a293e39890aee692f70d4e8d114d4081733a937b
          rm -rf diagrams/.git
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -czf diagrams-source-a293e398.tar.gz diagrams
          sha256sum diagrams-source-a293e398.tar.gz > diagrams-source-a293e398.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: diagrams-source-a293e398
          path: |
            diagrams-source-a293e398.tar.gz
            diagrams-source-a293e398.sha256
          if-no-files-found: error
