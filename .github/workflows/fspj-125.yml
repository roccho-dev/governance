name: fspj-125 manifest

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - proposals

permissions:
  contents: read

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check manifest
        run: |
          set -euo pipefail
          test -s docs/fspj-125/m.json
          grep -q 'fspj125.manifest.v1' docs/fspj-125/m.json
          grep -q 'ready' docs/fspj-125/m.json
