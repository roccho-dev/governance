name: gov-canary

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: governance-final-canary
  cancel-in-progress: true

jobs:
  topology:
    name: final topology and promotion shadow observer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout governance
        uses: actions/checkout@v4
        with:
          ref: proposals
          persist-credentials: false
      - name: Run evidence-only topology and promotion selftests
        run: |
          set -euo pipefail
          python3 tools/check-package-final-ci-production.py selftest --json | tee "$RUNNER_TEMP/final-ci-topology-selftest.json"
          python3 tools/check-package-ci-final-role-demotion.py check --json | tee "$RUNNER_TEMP/final-ci-role-report.json"
          python3 tools/check-live-final-ci-consumers.py selftest | tee "$RUNNER_TEMP/live-consumer-selftest.json"
          python3 tools/check-live-final-ci-control-plane.py selftest | tee "$RUNNER_TEMP/control-plane-selftest.json"
          python3 tools/check-promotion-shadow-integration.py selftest --json | tee "$RUNNER_TEMP/promotion-shadow-selftest.json"
          python3 tools/check-promotion-shadow-integration.py canary --json | tee "$RUNNER_TEMP/promotion-shadow-canary.json"
          grep -q '"productionPromotionEffect":false' "$RUNNER_TEMP/promotion-shadow-selftest.json"
          grep -q '"rulesetAffectsPromotionClosure":false' "$RUNNER_TEMP/promotion-shadow-canary.json"
      - name: Upload topology observation
        uses: actions/upload-artifact@v4
        with:
          name: gov-canary-topology-observation
          path: |
            ${{ runner.temp }}/final-ci-topology-selftest.json
            ${{ runner.temp }}/final-ci-role-report.json
            ${{ runner.temp }}/live-consumer-selftest.json
            ${{ runner.temp }}/control-plane-selftest.json
            ${{ runner.temp }}/promotion-shadow-selftest.json
            ${{ runner.temp }}/promotion-shadow-canary.json
          if-no-files-found: error

  selected-consumers:
    name: live selected consumer observer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout governance
        uses: actions/checkout@v4
        with:
          ref: proposals
          persist-credentials: false
      - name: Fetch current UI and Ops claims, runs, and artifact bodies
        run: |
          set -euo pipefail
          python3 tools/check-live-final-ci-consumers.py capture --out "$RUNNER_TEMP/live-selected-consumers.json"
          grep -q '"status":"pass"' "$RUNNER_TEMP/live-selected-consumers.json"
          grep -q '"candidateSha"' "$RUNNER_TEMP/live-selected-consumers.json"
          grep -q '"artifactDigest"' "$RUNNER_TEMP/live-selected-consumers.json"
      - name: Upload current consumer observation
        uses: actions/upload-artifact@v4
        with:
          name: gov-canary-live-selected-consumers
          path: ${{ runner.temp }}/live-selected-consumers.json
          if-no-files-found: error

  control-plane:
    name: informational GitHub ruleset observer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout governance
        uses: actions/checkout@v4
        with:
          ref: proposals
          persist-credentials: false
      - name: Observe current ruleset state without promotion authority
        id: observe
        continue-on-error: true
        run: |
          set -o pipefail
          python3 tools/check-live-final-ci-control-plane.py check --out "$RUNNER_TEMP/live-control-plane.json" 2>&1 | tee "$RUNNER_TEMP/live-control-plane.log"
      - name: Reduce informational ruleset observation
        if: always()
        env:
          OBSERVATION_OUTCOME: ${{ steps.observe.outcome }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path=Path(os.environ['RUNNER_TEMP'])/'live-control-plane.json'
          observed=json.loads(path.read_text()) if path.exists() else {'status':'unavailable'}
          report={'kind':'governance.rulesetInformation.v1','status':'observed' if os.environ['OBSERVATION_OUTCOME']=='success' else 'absent-or-unavailable','severity':'information','promotionClosureImpact':'none','githubRulesetRequired':False,'providerAuthority':False,'observed':observed,'authority':False}
          (Path(os.environ['RUNNER_TEMP'])/'ruleset-information.json').write_text(json.dumps(report,sort_keys=True,separators=(',',':'))+'\n')
          PY
      - name: Upload control-plane information
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gov-canary-live-control-plane
          path: |
            ${{ runner.temp }}/live-control-plane.json
            ${{ runner.temp }}/live-control-plane.log
            ${{ runner.temp }}/ruleset-information.json
          if-no-files-found: warn

  contract-modeling:
    name: recursive contract-modeling observer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout governance
        uses: actions/checkout@v4
        with:
          ref: proposals
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
          cache: pip
          cache-dependency-path: tools/contract-modeling/requirements.txt
      - name: Install pinned dependencies
        run: python3 -m pip install --disable-pip-version-check -r tools/contract-modeling/requirements.txt
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-experimental-features = nix-command flakes
      - name: Run evidence-only contract-modeling proof
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          python3 -m unittest discover -s tools/contract-modeling/tests -p 'test_*.py'
          CANDIDATE_SHA="$CANDIDATE_SHA" bash tools/contract-modeling/run-proof.sh
      - name: Upload contract-modeling observation
        uses: actions/upload-artifact@v4
        with:
          name: gov-canary-contract-modeling
          path: tools/contract-modeling/out/
          if-no-files-found: error

  adrs-observer:
    name: read-only ADRS and promotion candidate observer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout governance
        uses: actions/checkout@v4
        with:
          ref: proposals
          persist-credentials: false
      - name: Validate ADRS reader configuration
        env:
          ADRS_READER_CLIENT_ID: ${{ vars['ADRS_READER_CLIENT_ID'] }}
          ADRS_READER_PRIVATE_KEY: ${{ secrets['ADRS_READER_PRIVATE_KEY'] }}
        run: |
          set -euo pipefail
          test -n "$ADRS_READER_CLIENT_ID"
          test -n "$ADRS_READER_PRIVATE_KEY"
      - name: Create least-privilege ADRS observer token
        id: adrs-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars['ADRS_READER_CLIENT_ID'] }}
          private-key: ${{ secrets['ADRS_READER_PRIVATE_KEY'] }}
          owner: roccho-dev
          repositories: adrs
          permission-contents: read
          permission-issues: read
      - name: Checkout exact ADRS 234 candidate
        uses: actions/checkout@v4
        with:
          repository: roccho-dev/adrs
          ref: c9d4d0afd0679adc2a49e40d5e9e90ca6fd8f068
          path: candidate-adrs
          token: ${{ steps.adrs-token.outputs.token }}
          persist-credentials: false
      - name: Checkout exact signed-promotion ADRS candidate
        uses: actions/checkout@v4
        with:
          repository: roccho-dev/adrs
          ref: 70b7c37c434e01b56f53a27091dab43b222d8f76
          path: promotion-adrs
          token: ${{ steps.adrs-token.outputs.token }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-experimental-features = nix-command flakes
      - name: Install pinned checker dependencies
        run: |
          python3 -m pip install --disable-pip-version-check -r tools/code-governance/requirements.txt cryptography==46.0.4
          go install cuelang.org/go/cmd/cue@v0.9.2
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - name: Run live read-only ADRS observation
        env:
          ADRS_TOKEN: ${{ steps.adrs-token.outputs.token }}
        run: |
          set -euo pipefail
          tools/code-governance/run-live-proof.sh 2>&1 | tee "$RUNNER_TEMP/gov-canary-adrs.log"
      - name: Run exact ADRS 234 candidate observation
        run: |
          set -euo pipefail
          test "$(git -C candidate-adrs rev-parse HEAD)" = "c9d4d0afd0679adc2a49e40d5e9e90ca6fd8f068"
          nix flake check -L "path:$PWD/candidate-adrs" 2>&1 | tee "$RUNNER_TEMP/gov-canary-adrs-234.log"
          (
            cd candidate-adrs
            bash ci/check-recursive-contract-modeling-v1-static.sh
            python3 tools/check-recursive-contract-modeling-v1.py selftest
          ) 2>&1 | tee -a "$RUNNER_TEMP/gov-canary-adrs-234.log"
      - name: Run exact signed-promotion ADRS candidate observation
        run: |
          set -euo pipefail
          test "$(git -C promotion-adrs rev-parse HEAD)" = "70b7c37c434e01b56f53a27091dab43b222d8f76"
          (
            cd promotion-adrs
            cue vet adr/schema.cue adr/src/01KXNPWCS70N175PPHSQ4BSV1H-company-operating-contract-signed-promotion.cue
            cue vet adr/schema.cue adr/src/01KXBEYD56HE04FEJ7YMD5JZ9N-final-ci-signed-promotion-topology.cue
            python3 tools/check-signed-promotion-v1.py candidate
            python3 tools/check-signed-promotion-v1.py selftest
            bash ci/check-signed-promotion-v1-static.sh
          ) 2>&1 | tee "$RUNNER_TEMP/gov-canary-signed-promotion.log"
          grep -q 'publisher-public-key-unprovisioned' "$RUNNER_TEMP/gov-canary-signed-promotion.log"
      - name: Upload ADRS observation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gov-canary-adrs-observation
          path: |
            ${{ runner.temp }}/gov-canary-adrs.log
            ${{ runner.temp }}/gov-canary-adrs-234.log
            ${{ runner.temp }}/gov-canary-signed-promotion.log
            tools/code-governance/out/proof-receipt.json
            tools/code-governance/out/transports/live/transport-receipt.json
            tools/code-governance/out/evaluations/live-local/
          if-no-files-found: warn
