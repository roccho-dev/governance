name: gov-canary

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: governance-final-canary
  cancel-in-progress: true

jobs:
  topology:
    name: final topology and gov release observer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: proposals
          persist-credentials: false
      - name: Run evidence-only topology and release selftests
        run: |
          set -euo pipefail
          python3 tools/check-package-final-ci-production.py selftest --json | tee "$RUNNER_TEMP/final-ci-topology-selftest.json"
          python3 tools/check-package-ci-final-role-demotion.py check --json | tee "$RUNNER_TEMP/final-ci-role-report.json"
          python3 tools/check-live-final-ci-consumers.py selftest | tee "$RUNNER_TEMP/live-consumer-selftest.json"
          python3 tools/check-live-final-ci-control-plane.py selftest | tee "$RUNNER_TEMP/control-plane-selftest.json"
          python3 tools/check-gov-release-integration.py selftest --json | tee "$RUNNER_TEMP/gov-release-selftest.json"
          python3 tools/check-gov-release-integration.py canary --json | tee "$RUNNER_TEMP/gov-release-canary.json"
          grep -q '"acceptedDecisionDigest":"sha256:51a0fb65a990981c392ff1f7d5c9f9fdb61f09c3caa81eef656ebbd3d7e22c9f"' "$RUNNER_TEMP/gov-release-canary.json"
          grep -q '"rulesetAffectsReleaseClosure":false' "$RUNNER_TEMP/gov-release-canary.json"
      - uses: actions/upload-artifact@v4
        with:
          name: gov-canary-topology-observation
          path: |
            ${{ runner.temp }}/final-ci-topology-selftest.json
            ${{ runner.temp }}/final-ci-role-report.json
            ${{ runner.temp }}/live-consumer-selftest.json
            ${{ runner.temp }}/control-plane-selftest.json
            ${{ runner.temp }}/gov-release-selftest.json
            ${{ runner.temp }}/gov-release-canary.json
          if-no-files-found: error

  selected-consumers:
    name: live selected consumer observer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: proposals
          persist-credentials: false
      - name: Fetch current UI and Ops claims, runs, and artifact bodies
        run: |
          set -euo pipefail
          python3 tools/check-live-final-ci-consumers.py capture --out "$RUNNER_TEMP/live-selected-consumers.json"
          grep -q '"status":"pass"' "$RUNNER_TEMP/live-selected-consumers.json"
          grep -q '"artifactBodiesVerified":true' "$RUNNER_TEMP/live-selected-consumers.json"
          grep -q '"receiptCandidateShaBound":true' "$RUNNER_TEMP/live-selected-consumers.json"
      - uses: actions/upload-artifact@v4
        with:
          name: gov-canary-live-selected-consumers
          path: ${{ runner.temp }}/live-selected-consumers.json
          if-no-files-found: error

  release-observer:
    name: published gov release observer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: proposals
          persist-credentials: false
      - name: Fetch all published content-addressed release packets
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/releases"
          gh api "repos/$REPOSITORY/releases?per_page=100" --paginate > "$RUNNER_TEMP/release-pages.jsonl"
          python3 - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          text=Path(os.environ['RUNNER_TEMP']+'/release-pages.jsonl').read_text().strip(); releases=[]
          if text:
              decoder=json.JSONDecoder(); index=0
              while index < len(text):
                  while index < len(text) and text[index].isspace(): index += 1
                  if index >= len(text): break
                  page,index=decoder.raw_decode(text,index); releases.extend(page)
          for release in releases:
              tag=release.get('tag_name','')
              if release.get('draft') or not tag.startswith('gov-release/'): continue
              parts=tag.split('/')
              assert len(parts)==3 and len(parts[2])==64 and all(c in '0123456789abcdef' for c in parts[2]), 'non-content-addressed-release-tag'
              target=Path(os.environ['RUNNER_TEMP'])/'releases'/(parts[1]+'__'+parts[2]); target.mkdir(parents=True,exist_ok=True)
              for pattern in ['accepted-decision.json','gov-release-manifest.json','gov-engine-descriptor.json','gov-nix-output-descriptor.json','gov-release-readback-receipt.json']:
                  subprocess.run(['gh','release','download',tag,'--repo',os.environ['REPOSITORY'],'--pattern',pattern,'--dir',str(target)],check=True)
              (target/'tag.txt').write_text(tag+'\n')
          PY
      - name: Validate complete chain and selected release readback
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'releases'
          def load(path):
              value=json.loads(path.read_text()); assert isinstance(value,dict); return value
          def canonical(value): return json.dumps(value,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()
          def digest(value): return 'sha256:'+hashlib.sha256(canonical(value)).hexdigest()
          by_sequence={}; by_digest={}; release_ids=set(); locations={}
          for directory in sorted(root.iterdir() if root.exists() else []):
              decision=load(directory/'accepted-decision.json')
              manifest=load(directory/'gov-release-manifest.json')
              engine=load(directory/'gov-engine-descriptor.json')
              nix=load(directory/'gov-nix-output-descriptor.json')
              receipt=load(directory/'gov-release-readback-receipt.json')
              assert decision['kind']=='govReleaseAcceptedDecision.v1'
              decision_digest=digest(decision)
              assert manifest['acceptedDecisionDigest']==decision_digest
              assert manifest['govEngineDigest']==digest(engine)
              assert manifest['nixOutputDigest']==digest(nix)
              assert set(manifest)=={'kind','releaseId','sequence','previousReleaseDigest','supersedesReleaseDigest','acceptedDecisionDigest','govEngineDigest','nixOutputDigest','status'}
              assert manifest['kind']=='govReleaseManifest.v1' and manifest['status']=='adopted'
              release_digest=digest(manifest); tag=(directory/'tag.txt').read_text().strip(); parts=tag.split('/')
              assert parts[1]==manifest['releaseId'] and parts[2]==release_digest[7:]
              assert receipt['kind']=='govReleaseReadbackReceipt.v1' and receipt['status']=='pass'
              assert receipt['releaseId']==manifest['releaseId'] and receipt['releaseDigest']==receipt['observedManifestDigest']==release_digest
              assert receipt['adopted'] is True and receipt['authority'] is False
              assert manifest['sequence'] not in by_sequence and manifest['releaseId'] not in release_ids
              by_sequence[manifest['sequence']]=(release_digest,manifest); by_digest[release_digest]=manifest; release_ids.add(manifest['releaseId']); locations[release_digest]=directory
          sequences=sorted(by_sequence); assert sequences==list(range(len(sequences)))
          for sequence in sequences:
              release_digest,manifest=by_sequence[sequence]
              assert manifest['previousReleaseDigest'] is None if sequence==0 else manifest['previousReleaseDigest']==by_sequence[sequence-1][0]
              supersedes=manifest['supersedesReleaseDigest']
              if supersedes is not None: assert supersedes in by_digest and by_digest[supersedes]['sequence']<sequence
          if not sequences:
              report={'kind':'governance.govReleaseLiveObservation.v2','status':'absent','releaseCount':0,'selectedReleaseId':None,'selectedReleaseDigest':None,'operationalAdoptionEffect':False,'authority':False}
          else:
              selected_digest,selected=by_sequence[sequences[-1]]
              report={'kind':'governance.govReleaseLiveObservation.v2','status':'pass','releaseCount':len(sequences),'selectedReleaseId':selected['releaseId'],'selectedReleaseDigest':selected_digest,'sequence':selected['sequence'],'acceptedDecisionDigest':selected['acceptedDecisionDigest'],'govEngineDigest':selected['govEngineDigest'],'nixOutputDigest':selected['nixOutputDigest'],'selectedReadback':True,'operationalAdoptionEffect':True,'authority':False}
          Path(os.environ['RUNNER_TEMP']+'/gov-release-live-observation.json').write_text(json.dumps(report,sort_keys=True,separators=(',',':'))+'\n')
          if sequences:
              with Path(os.environ['RUNNER_TEMP']+'/gov-release-manifests.jsonl').open('w') as file:
                  for sequence in sequences: file.write(json.dumps(by_sequence[sequence][1],sort_keys=True,separators=(',',':'))+'\n')
              Path(os.environ['RUNNER_TEMP']+'/gov-release-selected.json').write_text(json.dumps(report,sort_keys=True,separators=(',',':'))+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gov-canary-release-observation
          path: |
            ${{ runner.temp }}/gov-release-live-observation.json
            ${{ runner.temp }}/gov-release-selected.json
            ${{ runner.temp }}/gov-release-manifests.jsonl
          if-no-files-found: warn

  control-plane:
    name: informational GitHub ruleset observer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: proposals
          persist-credentials: false
      - id: observe
        continue-on-error: true
        run: python3 tools/check-live-final-ci-control-plane.py check --out "$RUNNER_TEMP/live-control-plane.json" 2>&1 | tee "$RUNNER_TEMP/live-control-plane.log"
      - name: Reduce informational observation
        if: always()
        env:
          OUTCOME: ${{ steps.observe.outcome }}
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          report={'kind':'governance.rulesetInformation.v2','status':'observed' if os.environ['OUTCOME']=='success' else 'absent-or-unavailable','severity':'information','releaseClosureImpact':'none','githubRulesetRequired':False,'providerAuthority':False,'authority':False}
          Path(os.environ['RUNNER_TEMP']+'/ruleset-information.json').write_text(json.dumps(report,sort_keys=True,separators=(',',':'))+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gov-canary-live-control-plane
          path: |
            ${{ runner.temp }}/live-control-plane.json
            ${{ runner.temp }}/live-control-plane.log
            ${{ runner.temp }}/ruleset-information.json
          if-no-files-found: warn

  contract-modeling:
    name: recursive contract-modeling observer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: proposals
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
          cache: pip
          cache-dependency-path: tools/contract-modeling/requirements.txt
      - run: python3 -m pip install --disable-pip-version-check -r tools/contract-modeling/requirements.txt
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: extra-experimental-features = nix-command flakes
      - name: Run evidence-only contract-modeling proof
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          python3 -m unittest discover -s tools/contract-modeling/tests -p 'test_*.py'
          CANDIDATE_SHA="$CANDIDATE_SHA" bash tools/contract-modeling/run-proof.sh
      - uses: actions/upload-artifact@v4
        with:
          name: gov-canary-contract-modeling
          path: tools/contract-modeling/out/
          if-no-files-found: error

  adrs-observer:
    name: read-only ADRS and gov release candidate observer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: proposals
          persist-credentials: false
      - name: Validate ADRS reader configuration
        env:
          ADRS_READER_CLIENT_ID: ${{ vars['ADRS_READER_CLIENT_ID'] }}
          ADRS_READER_PRIVATE_KEY: ${{ secrets['ADRS_READER_PRIVATE_KEY'] }}
        run: test -n "$ADRS_READER_CLIENT_ID" && test -n "$ADRS_READER_PRIVATE_KEY"
      - id: adrs-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars['ADRS_READER_CLIENT_ID'] }}
          private-key: ${{ secrets['ADRS_READER_PRIVATE_KEY'] }}
          owner: roccho-dev
          repositories: adrs
          permission-contents: read
          permission-issues: read
      - name: Checkout exact gov release ADRS candidate
        uses: actions/checkout@v4
        with:
          repository: roccho-dev/adrs
          ref: 5a8a6d9968178144b2e547f28bb9977a7b65c755
          path: release-adrs
          token: ${{ steps.adrs-token.outputs.token }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - name: Install CUE
        run: |
          go install cuelang.org/go/cmd/cue@v0.9.2
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - name: Run live ADRS observation and exact gov release candidate proof
        env:
          ADRS_TOKEN: ${{ steps.adrs-token.outputs.token }}
        run: |
          set -euo pipefail
          tools/code-governance/run-live-proof.sh 2>&1 | tee "$RUNNER_TEMP/gov-canary-adrs.log"
          test "$(git -C release-adrs rev-parse HEAD)" = 5a8a6d9968178144b2e547f28bb9977a7b65c755
          (
            cd release-adrs
            cue vet adr/schema.cue adr/src/01KXNPWCS70N175PPHSQ4BSV1H-company-operating-contract-gov-release.cue
            cue vet adr/schema.cue adr/src/01KXBEYD56HE04FEJ7YMD5JZ9N-final-ci-gov-release-topology.cue
            python3 tools/check-gov-release-v1.py contract
            python3 tools/check-gov-release-v1.py decision
            python3 tools/check-gov-release-v1.py selftest
            bash ci/check-gov-release-v1-static.sh
          ) 2>&1 | tee "$RUNNER_TEMP/gov-canary-gov-release.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gov-canary-adrs-observation
          path: |
            ${{ runner.temp }}/gov-canary-adrs.log
            ${{ runner.temp }}/gov-canary-gov-release.log
            tools/code-governance/out/proof-receipt.json
            tools/code-governance/out/transports/live/transport-receipt.json
          if-no-files-found: warn
