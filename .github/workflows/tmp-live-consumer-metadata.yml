name: temporary live consumer metadata

on:
  pull_request:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Print current exact-head consumer artifacts
        run: |
          python3 - <<'PY'
          import json,urllib.parse,urllib.request
          def get(path):
              request=urllib.request.Request('https://api.github.com'+path,headers={'Accept':'application/vnd.github+json','User-Agent':'gov-live-metadata','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(request,timeout=60) as response: return json.load(response)
          for repository in ['roccho-dev/ui','roccho-dev/ops']:
              metadata=get('/repos/'+repository)
              branch=metadata['default_branch']
              head=get('/repos/'+repository+'/git/ref/heads/'+branch)['object']['sha']
              query=urllib.parse.urlencode({'branch':branch,'event':'push','status':'success','per_page':100})
              runs=get('/repos/'+repository+'/actions/runs?'+query)['workflow_runs']
              matches=[run for run in runs if run.get('head_sha')==head and run.get('conclusion')=='success' and run.get('event')=='push' and (run.get('name')=='final CI consumer' or run.get('path')=='.github/workflows/final-ci-consumer.yml')]
              assert matches, repository+':run-missing'
              run=sorted(matches,key=lambda value:int(value['id']),reverse=True)[0]
              artifacts=get(f"/repos/{repository}/actions/runs/{run['id']}/artifacts?per_page=100")['artifacts']
              matches=[artifact for artifact in artifacts if artifact.get('name')=='final-ci-consumer-receipt' and not artifact.get('expired')]
              assert len(matches)==1, repository+':artifact-cardinality'
              artifact=matches[0]
              print(json.dumps({'repository':repository,'branch':branch,'head':head,'runId':run['id'],'artifactId':artifact['id'],'artifactDigest':artifact['digest'],'artifactCreatedAt':artifact['created_at']},sort_keys=True,separators=(',',':')))
          PY
