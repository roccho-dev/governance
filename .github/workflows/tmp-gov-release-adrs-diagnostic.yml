name: temporary gov release ADRS diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - id: token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars['ADRS_READER_CLIENT_ID'] }}
          private-key: ${{ secrets['ADRS_READER_PRIVATE_KEY'] }}
          owner: roccho-dev
          repositories: adrs
          permission-contents: read
      - uses: actions/checkout@v4
        with:
          repository: roccho-dev/adrs
          ref: 60dcc0bd92b4bfdd60dadb7817cbb9b91dc9c326
          token: ${{ steps.token.outputs.token }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - name: install CUE
        run: go install cuelang.org/go/cmd/cue@v0.9.2
      - name: CUE decision 223
        run: "$HOME/go/bin/cue" vet adr/schema.cue adr/src/01KXNPWCS70N175PPHSQ4BSV1H-company-operating-contract-gov-release.cue
      - name: CUE decision 233
        run: "$HOME/go/bin/cue" vet adr/schema.cue adr/src/01KXBEYD56HE04FEJ7YMD5JZ9N-final-ci-gov-release-topology.cue
      - name: contract
        run: python3 tools/check-gov-release-v1.py contract
      - name: selftest
        run: python3 tools/check-gov-release-v1.py selftest
      - name: static
        run: bash ci/check-gov-release-v1-static.sh
