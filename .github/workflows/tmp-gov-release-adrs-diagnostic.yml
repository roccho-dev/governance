name: temporary gov release ADRS diagnostic

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - id: token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars['ADRS_READER_CLIENT_ID'] }}
          private-key: ${{ secrets['ADRS_READER_PRIVATE_KEY'] }}
          owner: roccho-dev
          repositories: adrs
          permission-contents: read
      - uses: actions/checkout@v4
        with:
          repository: roccho-dev/adrs
          ref: 60dcc0bd92b4bfdd60dadb7817cbb9b91dc9c326
          token: ${{ steps.token.outputs.token }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - name: install CUE
        run: go install cuelang.org/go/cmd/cue@v0.9.2
      - id: cue223
        continue-on-error: true
        name: CUE decision 223
        run: "$HOME/go/bin/cue" vet adr/schema.cue adr/src/01KXNPWCS70N175PPHSQ4BSV1H-company-operating-contract-gov-release.cue
      - id: cue233
        continue-on-error: true
        name: CUE decision 233
        run: "$HOME/go/bin/cue" vet adr/schema.cue adr/src/01KXBEYD56HE04FEJ7YMD5JZ9N-final-ci-gov-release-topology.cue
      - id: contract
        continue-on-error: true
        name: contract
        run: python3 tools/check-gov-release-v1.py contract
      - id: selftest
        continue-on-error: true
        name: selftest
        run: python3 tools/check-gov-release-v1.py selftest
      - id: static
        continue-on-error: true
        name: static
        run: bash ci/check-gov-release-v1-static.sh
      - name: Post exact diagnostic
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CONTRACT_SHA: ${{ steps.contract.outcome }}
          SELFTEST: ${{ steps.selftest.outcome }}
          STATIC: ${{ steps.static.outcome }}
          CUE223: ${{ steps.cue223.outcome }}
          CUE233: ${{ steps.cue233.outcome }}
        run: |
          actual_contract=$(sha256sum release/v1/contract.json | cut -d' ' -f1)
          actual_checker=$(sha256sum tools/check-gov-release-v1.py | cut -d' ' -f1)
          body=$(cat <<EOF
          <!-- GOV-RELEASE-ADRS-DIAGNOSTIC -->
          exact ADRS head: 60dcc0bd92b4bfdd60dadb7817cbb9b91dc9c326

          - cue223: $CUE223
          - cue233: $CUE233
          - contract: $CONTRACT_SHA
          - selftest: $SELFTEST
          - static: $STATIC
          - actual contract sha256: $actual_contract
          - actual checker sha256: $actual_checker
          EOF
          )
          gh pr comment 166 --repo "$GITHUB_REPOSITORY" --body "$body"
      - name: Reduce diagnostic
        env:
          CUE223: ${{ steps.cue223.outcome }}
          CUE233: ${{ steps.cue233.outcome }}
          CONTRACT: ${{ steps.contract.outcome }}
          SELFTEST: ${{ steps.selftest.outcome }}
          STATIC: ${{ steps.static.outcome }}
        run: |
          test "$CUE223" = success
          test "$CUE233" = success
          test "$CONTRACT" = success
          test "$SELFTEST" = success
          test "$STATIC" = success
