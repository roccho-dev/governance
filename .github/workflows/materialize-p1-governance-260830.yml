name: Materialize P1 Governance Source 260830

on:
  push:
    branches:
      - feat/p1-canon-tdd-final-260830
    paths:
      - .github/workflows/materialize-p1-governance-260830.yml
      - .transport/p1-governance.patch.gz.b64.part*

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Restore exact clean target and prove source tree
        shell: bash
        env:
          BASE_COMMIT: 6b20ba62e5b84de7549cc1df801af453dec03a38
          TARGET_BRANCH: pr/p1-canon-tdd-final-260830
          FULL_EXPECTED_TREE: a8fe79b11fdaf9bfa4658462a660263bfcf4e434
          TARGET_EXPECTED_TREE: 8dc59b2aeda5c9605e16308e4da298e0964d17ab
          CARRIER_SHA256: 71a254363814bd97e2b0983b8af9827836cee9a7070563ccab09c40fe6793aac
          GZIP_SHA256: b44c190073c5127a9f813ad9ed90cdcc810e8af2e49ed064649f5d21c348fde0
          PATCH_SHA256: fc094a44bd635ca8b9a73f6a6b40c86cd142289b30723b40997494b34bfe982b
        run: |
          set -euo pipefail

          tmp="$RUNNER_TEMP/p1-governance"
          target="$tmp/target"
          mkdir -p "$tmp"

          cd "$GITHUB_WORKSPACE/.transport"
          sha256sum --check <<'SUMS'
          8bcf81750e0e7296c1f23e285a3f3dd5e6b6f27ad1b00aad3bf015d0705978ba  p1-governance.patch.gz.b64.part00
          e174040def28cebdfee3b9eec0b90e1c671034f90c842b8c48b789746238bade  p1-governance.patch.gz.b64.part01
          9784adf4f720f690b41522073e120da4e401c402bd4cb5542ca671a092e58380  p1-governance.patch.gz.b64.part02
          d467aa662e6a9702b6df6fc4690da9ad16a636aaa92264bc1eda26c857f5f12c  p1-governance.patch.gz.b64.part03
          3483ae17615177735e3c9a7db30b6f7feaf243421b25e9b336d5e07a732cfc20  p1-governance.patch.gz.b64.part04
          f6dc02217ab60b951935d81eeeb21513e7d01144ed418f7cd1dec5b263b68a5a  p1-governance.patch.gz.b64.part05
          b8c375a5252e00e49aa17e63a0c3672cb5f9473af3a9d5e0cf9e182123aa024e  p1-governance.patch.gz.b64.part06
          SUMS

          parts=(p1-governance.patch.gz.b64.part*)
          test "${#parts[@]}" -eq 7
          cat "${parts[@]}" > "$tmp/change.patch.gz.b64"
          test "$(sha256sum "$tmp/change.patch.gz.b64" | cut -d' ' -f1)" = "$CARRIER_SHA256"

          base64 --decode "$tmp/change.patch.gz.b64" > "$tmp/change.patch.gz"
          test "$(sha256sum "$tmp/change.patch.gz" | cut -d' ' -f1)" = "$GZIP_SHA256"
          gzip --decompress --stdout "$tmp/change.patch.gz" > "$tmp/change.patch"
          test "$(sha256sum "$tmp/change.patch" | cut -d' ' -f1)" = "$PATCH_SHA256"

          cd "$GITHUB_WORKSPACE"
          git cat-file -e "$BASE_COMMIT^{commit}"
          git worktree add --detach "$target" "$BASE_COMMIT"
          cd "$target"

          git apply --index "$tmp/change.patch"
          git diff --cached --check
          test "$(git write-tree)" = "$FULL_EXPECTED_TREE"

          export PYTHONDONTWRITEBYTECODE=1
          python3 -m unittest \
            tools.package_obligations.tests.test_fixture \
            tools.package_obligations.tests.test_materialize \
            tools.package_obligations.tests.test_join \
            tools.gov_release.tests.test_canon_tdd \
            tools.gov_release.tests.test_package_output \
            2>&1 | tee "$tmp/focused-tests.log"
          python3 -m unittest discover -s tools/gov_release/tests -p 'test_*.py' \
            2>&1 | tee "$tmp/gov-release-tests.log"

          # GitHub Actions' token cannot update workflow files. Keep the source
          # commit clean and add the verified workflow through the normal user
          # GitHub write boundary after this exact source branch exists.
          git restore --source="$BASE_COMMIT" --staged --worktree \
            .github/workflows/gov-release.yml
          test "$(git write-tree)" = "$TARGET_EXPECTED_TREE"

          git config user.name roccho
          git config user.email 40359643+roccho-dev@users.noreply.github.com
          export GIT_AUTHOR_DATE=2026-08-30T03:45:00Z
          export GIT_COMMITTER_DATE=2026-08-30T03:45:00Z
          git commit -m "feat: add P1 obligations and final-only Canon TDD core"

          target_commit="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_EXPECTED_TREE"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH" --force

          remote_commit="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$remote_commit" = "$target_commit"
          git fetch --no-tags origin "refs/heads/$TARGET_BRANCH"
          remote_tree="$(git rev-parse FETCH_HEAD^{tree})"
          test "$remote_tree" = "$TARGET_EXPECTED_TREE"

          python3 - \
            "$tmp/materialization-receipt.json" \
            "$BASE_COMMIT" \
            "$TARGET_BRANCH" \
            "$target_commit" \
            "$TARGET_EXPECTED_TREE" \
            "$remote_commit" \
            "$remote_tree" \
            "$FULL_EXPECTED_TREE" \
            "$CARRIER_SHA256" \
            "$GZIP_SHA256" \
            "$PATCH_SHA256" \
            "$tmp/focused-tests.log" \
            "$tmp/gov-release-tests.log" <<'PY'
          import hashlib, json, sys
          from pathlib import Path

          def digest(path):
              return "sha256:" + hashlib.sha256(Path(path).read_bytes()).hexdigest()

          (
              output,
              base_commit,
              target_branch,
              target_commit,
              target_tree,
              remote_commit,
              remote_tree,
              full_tree,
              carrier_sha,
              gzip_sha,
              patch_sha,
              focused_log,
              release_log,
          ) = sys.argv[1:]

          value = {
              "kind": "governance.p1SourceMaterializationReceipt.v1",
              "baseCommit": base_commit,
              "targetBranch": target_branch,
              "targetCommit": target_commit,
              "targetTree": target_tree,
              "remoteCommit": remote_commit,
              "remoteTree": remote_tree,
              "verifiedFullCandidateTree": full_tree,
              "workflowPendingNormalGitHubWrite": True,
              "carrierSha256": "sha256:" + carrier_sha,
              "gzipSha256": "sha256:" + gzip_sha,
              "patchSha256": "sha256:" + patch_sha,
              "focusedTests": digest(focused_log),
              "govReleaseTests": digest(release_log),
              "canonicalGreenEmitted": False,
          }
          Path(output).write_text(
              json.dumps(value, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload source materialization evidence
        uses: actions/upload-artifact@v4
        with:
          name: p1-governance-source-materialization
          path: |
            ${{ runner.temp }}/p1-governance/materialization-receipt.json
            ${{ runner.temp }}/p1-governance/focused-tests.log
            ${{ runner.temp }}/p1-governance/gov-release-tests.log
          if-no-files-found: error
          retention-days: 7
