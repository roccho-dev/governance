name: ADRS 237 exact-head diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  exact-adrs-237-proof:
    name: exact ADRS 237 hosted proof
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Validate ADRS reader configuration
        env:
          ADRS_READER_CLIENT_ID: ${{ vars['ADRS_READER_CLIENT_ID'] }}
          ADRS_READER_PRIVATE_KEY: ${{ secrets['ADRS_READER_PRIVATE_KEY'] }}
        run: |
          set -euo pipefail
          test -n "$ADRS_READER_CLIENT_ID"
          test -n "$ADRS_READER_PRIVATE_KEY"

      - name: Create least-privilege ADRS contents token
        id: adrs-contents-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars['ADRS_READER_CLIENT_ID'] }}
          private-key: ${{ secrets['ADRS_READER_PRIVATE_KEY'] }}
          owner: roccho-dev
          repositories: adrs
          permission-contents: read

      - name: Checkout exact ADRS candidate
        uses: actions/checkout@v4
        with:
          repository: roccho-dev/adrs
          ref: c9d4d0afd0679adc2a49e40d5e9e90ca6fd8f068
          path: .diagnostic/adrs
          token: ${{ steps.adrs-contents-token.outputs.token }}
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-experimental-features = nix-command flakes

      - name: Verify exact checkout
        working-directory: .diagnostic/adrs
        run: test "$(git rev-parse HEAD)" = "c9d4d0afd0679adc2a49e40d5e9e90ca6fd8f068"

      - name: Run exact candidate Nix validation
        working-directory: .diagnostic/adrs
        run: |
          set -o pipefail
          nix flake check -L 2>&1 | tee "$RUNNER_TEMP/adrs-237-nix.log"

      - name: Run deterministic recursive contract proofs
        working-directory: .diagnostic/adrs
        run: |
          set -euo pipefail
          first="$RUNNER_TEMP/adrs-237-first"
          second="$RUNNER_TEMP/adrs-237-second"
          selftest="$RUNNER_TEMP/adrs-237-selftest.json"
          rm -rf "$first" "$second"
          python3 tools/check-recursive-contract-modeling-v1.py check --out "$first" >/dev/null
          python3 tools/check-recursive-contract-modeling-v1.py check --out "$second" >/dev/null
          python3 tools/check-recursive-contract-modeling-v1.py selftest | tee "$selftest"
          cmp "$first/report.json" "$second/report.json"
          cmp "$first/receipt.json" "$second/receipt.json"
          cmp "$first/pass" "$second/pass"
          jq -e '.status == "pass" and .destructiveCaseCount == 38 and .requiredCategoryCount == 26 and (.destructiveReasons | length) == 38 and (.positiveProofs | length) == 17 and (.metamorphicProofs | length) == 3 and .metamorphicProofs.transportInvariant == true and .metamorphicProofs.semanticSensitivity == true and .metamorphicProofs.inputOrderInvariant == true' "$selftest" >/dev/null
          jq -e '.acceptedDecisionDigest == "cc7ac3d6618b31eb0a0979b8aa0e2bfaf6abd95646e45c740d154c8204cd00d1" and .proofCount == 17 and (.positiveProofs | length) == 17' "$first/report.json" >/dev/null
          jq -e '.acceptedDecisionDigest == "cc7ac3d6618b31eb0a0979b8aa0e2bfaf6abd95646e45c740d154c8204cd00d1" and .bundleDigest == "cc7ac3d6618b31eb0a0979b8aa0e2bfaf6abd95646e45c740d154c8204cd00d1" and .authority == false and .effect == false' "$first/receipt.json" >/dev/null

      - name: Validate decision batch and exact digests
        working-directory: .diagnostic/adrs
        run: |
          set -euo pipefail
          bash ci/decision-append.sh --validate decision/live/issue-234-recursive-contract-modeling-v1.jsonl >/dev/null
          test "$(sha256sum contract_modeling/v1/contract.json | cut -d ' ' -f1)" = "1bc8ee618113215753c3be21f1a90db1c44007feb5e0b855fb0ee4bc6ca770e0"
          test "$(sha256sum contract_modeling/v1/closure.json | cut -d ' ' -f1)" = "8366b8fe8e756142676871f299313fe622c669306ad579094297ee98d6224c82"
          test "$(sha256sum contract_modeling/v1/source-seed.jsonl | cut -d ' ' -f1)" = "91440857f4d648b699f0f8c44f452a3615d03e9f2185095bf1283301650aec9c"
          test "$(sha256sum decision/live/issue-234-recursive-contract-modeling-v1.jsonl | cut -d ' ' -f1)" = "66c9df86a235ad20a716ca21ec650014a17c3f1b59aba448ccba01f249c9d5f7"
          test "$(sha256sum tools/check-recursive-contract-modeling-v1.py | cut -d ' ' -f1)" = "e51625fa3f8d7ea16840d15006097081e6513dd845f2ac82f9b6020f18caea5e"

      - name: Upload exact ADRS 237 diagnostic proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adrs-237-exact-head-diagnostic-hardened
          path: |
            ${{ runner.temp }}/adrs-237-nix.log
            ${{ runner.temp }}/adrs-237-first/
            ${{ runner.temp }}/adrs-237-selftest.json
          if-no-files-found: warn
