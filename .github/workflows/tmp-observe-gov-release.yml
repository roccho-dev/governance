name: temporary observe gov release

on:
  pull_request:
    branches:
      - proposals

permissions:
  actions: read
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - name: Read failed canary ADRS observer tail
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/$REPOSITORY/actions/jobs/88171395531/logs" > failed.log
          tail -n 25 failed.log
