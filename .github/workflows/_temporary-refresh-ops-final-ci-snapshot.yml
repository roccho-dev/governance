name: Temporary refresh Ops final CI snapshot

on:
  pull_request:
    branches: [proposals]
    paths:
      - .github/workflows/_temporary-refresh-ops-final-ci-snapshot.yml

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Validate reader configuration
        env:
          CLIENT_ID: ${{ vars['ADRS_READER_CLIENT_ID'] }}
          PRIVATE_KEY: ${{ secrets['ADRS_READER_PRIVATE_KEY'] }}
        run: test -n "$CLIENT_ID" && test -n "$PRIVATE_KEY"
      - id: token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars['ADRS_READER_CLIENT_ID'] }}
          private-key: ${{ secrets['ADRS_READER_PRIVATE_KEY'] }}
          owner: roccho-dev
          repositories: ui,ops
          permission-actions: read
          permission-contents: read
      - name: Download exact merged Ops receipt artifact
        env:
          TOKEN: ${{ steps.token.outputs.token }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os,urllib.request
          token=os.environ['TOKEN']
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'governance-snapshot-refresh'}
          def get_json(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=60) as r:return json.load(r)
          def get_bytes(url):
              h={**headers,'Accept':'application/octet-stream'}
              with urllib.request.urlopen(urllib.request.Request(url,headers=h),timeout=60) as r:return r.read()
          repo='roccho-dev/ops'; head='a622192703c53fea4890a3ad3618e2a0ac85032f'
          runs=get_json(f'https://api.github.com/repos/{repo}/actions/runs?branch=proposals&event=push&status=success&per_page=100')['workflow_runs']
          matches=[r for r in runs if r.get('head_sha')==head and r.get('name')=='final CI consumer' and r.get('conclusion')=='success']
          assert matches, 'missing exact push run'
          run=max(matches,key=lambda r:int(r['id']))
          artifacts=get_json(f'https://api.github.com/repos/{repo}/actions/runs/{run["id"]}/artifacts?per_page=100')['artifacts']
          matches=[a for a in artifacts if a.get('name')=='final-ci-consumer-receipt' and not a.get('expired')]
          assert len(matches)==1, matches
          artifact=matches[0]; body=get_bytes(f'https://api.github.com/repos/{repo}/actions/artifacts/{artifact["id"]}/zip')
          digest='sha256:'+hashlib.sha256(body).hexdigest()
          assert digest==artifact['digest'],(digest,artifact['digest'])
          open('ops-final-ci-consumer-receipt.zip','wb').write(body)
          open('ops-final-ci-consumer-receipt.zip.b64','w').write(base64.b64encode(body).decode()+'\n')
          open('ops-final-ci-snapshot-identity.json','w').write(json.dumps({'repository':repo,'head':head,'runId':run['id'],'artifactId':artifact['id'],'artifactDigest':artifact['digest'],'authority':False},sort_keys=True,separators=(',',':'))+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: merged-ops-final-ci-snapshot
          path: |
            ops-final-ci-consumer-receipt.zip
            ops-final-ci-consumer-receipt.zip.b64
            ops-final-ci-snapshot-identity.json
          if-no-files-found: error
