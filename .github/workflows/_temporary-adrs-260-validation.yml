name: Temporary ADRS 260 exact validation

on:
  pull_request:
    branches: [proposals]
    paths:
      - .github/workflows/_temporary-adrs-260-validation.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Validate ADRS reader configuration
        env:
          CLIENT_ID: ${{ vars['ADRS_READER_CLIENT_ID'] }}
          PRIVATE_KEY: ${{ secrets['ADRS_READER_PRIVATE_KEY'] }}
        run: test -n "$CLIENT_ID" && test -n "$PRIVATE_KEY"
      - id: adrs-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars['ADRS_READER_CLIENT_ID'] }}
          private-key: ${{ secrets['ADRS_READER_PRIVATE_KEY'] }}
          owner: roccho-dev
          repositories: adrs
          permission-contents: read
      - uses: actions/checkout@v6
        with:
          repository: roccho-dev/adrs
          ref: 1bbce6400724a0b0395dc8c5c3d3acb8d4bcade8
          path: candidate
          token: ${{ steps.adrs-token.outputs.token }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - name: Install CUE
        run: |
          go install cuelang.org/go/cmd/cue@v0.9.2
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - name: Run exact ADRS approval contract proof
        id: proof
        shell: bash
        run: |
          mkdir -p proof
          set +e
          test "$(git -C candidate rev-parse HEAD)" = 1bbce6400724a0b0395dc8c5c3d3acb8d4bcade8
          echo $? > proof/head.status
          (
            cd candidate
            cue vet adr/schema.cue adr/allowed.cue
            cue vet adr/schema.cue adr/src/01KYF3A0M0P7XJ6B9Q2C4R8T5V-approval-actor-v1.cue
          ) > proof/cue.log 2>&1
          echo $? > proof/cue.status
          python3 candidate/tools/check-approval-actor-v1.py selftest --out proof/selftest-a.json > proof/selftest-a.stdout 2> proof/selftest-a.stderr
          echo $? > proof/selftest-a.status
          python3 candidate/tools/check-approval-actor-v1.py selftest --out proof/selftest-b.json > proof/selftest-b.stdout 2> proof/selftest-b.stderr
          echo $? > proof/selftest-b.status
          cmp proof/selftest-a.json proof/selftest-b.json > proof/replay.log 2>&1
          echo $? > proof/replay.status
          (cd candidate && bash ci/check-approval-actor-v1-static.sh) > proof/static.log 2>&1
          echo $? > proof/static.status
          (cd candidate && bash ci/validate.sh) > proof/canonical.log 2>&1
          echo $? > proof/canonical.status
          python3 - <<'PY' > proof/summary.json
          import hashlib,json
          from pathlib import Path
          root=Path('candidate')
          files={}
          for rel in [
              'approval_actor/v1/contract.json',
              'approval_actor/v1/accepted-decision.json',
              'approval_actor/v1/release-manifest.json',
              'approval_actor/v1/proof.json',
              'approval_actor/v1/schemas/authority-grant.schema.json',
              'approval_actor/v1/schemas/github-approval-evidence.schema.json',
              'approval_actor/v1/schemas/approval-receipt.schema.json',
              'approval_actor/v1/schemas/implementation-manifest.schema.json',
          ]:
              files[rel]='sha256:'+hashlib.sha256((root/rel).read_bytes()).hexdigest()
          status_files=sorted(Path('proof').glob('*.status'))
          statuses={p.name:int(p.read_text().strip()) for p in status_files}
          report={'kind':'externalAdrsApprovalActorProof.v1','candidateHead':'1bbce6400724a0b0395dc8c5c3d3acb8d4bcade8','statuses':statuses,'files':files,'authority':False,'status':'PASS' if all(v==0 for v in statuses.values()) else 'FAIL'}
          print(json.dumps(report,sort_keys=True,separators=(',',':')))
          PY
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adrs-260-exact-validation
          path: proof/
          if-no-files-found: error
      - name: Enforce exact candidate proof
        if: always()
        run: |
          for file in proof/*.status; do test "$(cat "$file")" = 0; done
          test "$(python3 -c 'import json;print(json.load(open("proof/summary.json"))["status"])')" = PASS
