name: ADRS decisionctl
on:
  pull_request:
    branches: [proposals]
    paths:
      - 'packages/adrs318-decisionctl/**'
      - '.github/workflows/adrs-318-decisionctl.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test provider-neutral decision projection
        run: python3 -m unittest discover -s packages/adrs318-decisionctl/tests -v
