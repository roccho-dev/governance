name: diag ADRS 238 issue modeling

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  issue-modeling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact governance candidate
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Validate ADRS reader
        env:
          CLIENT_ID: ${{ vars['ADRS_READER_CLIENT_ID'] }}
          PRIVATE_KEY: ${{ secrets['ADRS_READER_PRIVATE_KEY'] }}
        run: test -n "$CLIENT_ID" && test -n "$PRIVATE_KEY"

      - id: adrs-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars['ADRS_READER_CLIENT_ID'] }}
          private-key: ${{ secrets['ADRS_READER_PRIVATE_KEY'] }}
          owner: roccho-dev
          repositories: adrs
          permission-issues: read
          permission-contents: read

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
          cache: pip
          cache-dependency-path: tools/contract-modeling/requirements.txt

      - name: Install pinned dependencies
        run: python3 -m pip install --disable-pip-version-check -r tools/contract-modeling/requirements.txt

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: extra-experimental-features = nix-command flakes

      - name: Read live ADRS Issue 238 JSONL
        env:
          ADRS_TOKEN: ${{ steps.adrs-token.outputs.token }}
        run: |
          set -euo pipefail
          mkdir -p diag-238
          python3 tools/contract-modeling/fixtures/generate.py > diag-238/generate.log
          python3 - <<'PY'
          import json, os, urllib.request
          from pathlib import Path

          expected_ids = [5010215539,5010217524,5010220937,5010222130,5010223536,5010225096]
          req = urllib.request.Request(
              'https://api.github.com/repos/roccho-dev/adrs/issues/238/comments?per_page=100',
              headers={
                  'Accept':'application/vnd.github+json',
                  'Authorization':f"Bearer {os.environ['ADRS_TOKEN']}",
                  'X-GitHub-Api-Version':'2022-11-28',
                  'User-Agent':'governance-adrs238-modeling-diagnostic/2',
              },
          )
          with urllib.request.urlopen(req, timeout=60) as response:
              comments=json.load(response)
          selected={int(c['id']):c for c in comments if int(c['id']) in expected_ids}
          assert sorted(selected)==expected_ids, (sorted(selected), expected_ids)
          rows=[]
          snapshot=[]
          for cid in expected_ids:
              body=selected[cid]['body']
              assert body and not body.startswith('```')
              comment_rows=[]
              for line_no,line in enumerate(body.splitlines(),1):
                  assert line.strip(), (cid,line_no,'blank')
                  value=json.loads(line)
                  assert isinstance(value,dict), (cid,line_no,'not-object')
                  assert value.get('schema_ref')=='contract-modeling/envelope.v1'
                  assert value.get('supersedes')==[]
                  comment_rows.append(value)
                  rows.append(value)
              snapshot.append({'comment_id':cid,'row_count':len(comment_rows),'rows':comment_rows})
          assert len(rows)==68, len(rows)
          ids=[r['id'] for r in rows]
          assert len(ids)==len(set(ids))
          assert not any(r.get('row_kind') in {'receipt','legacy-mapping'} for r in rows)
          assert not any(r.get('semantic_kind')=='effect-receipt' for r in rows)
          Path('diag-238/issue-238-live.jsonl').write_text(
              ''.join(json.dumps(r,sort_keys=True,separators=(',',':'))+'\n' for r in rows),encoding='utf-8')
          Path('diag-238/issue-238-comments.json').write_text(
              json.dumps(snapshot,sort_keys=True,separators=(',',':'))+'\n',encoding='utf-8')
          base=[]
          for line in Path('tools/contract-modeling/fixtures/claims.jsonl').read_text().splitlines():
              if line.strip(): base.append(json.loads(line))
          combined=base+rows
          Path('diag-238/combined.jsonl').write_text(
              ''.join(json.dumps(r,sort_keys=True,separators=(',',':'))+'\n' for r in combined),encoding='utf-8')
          PY

      - name: Evaluate live ADRS Issue model twice
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 tools/contract-modeling/bin/evaluate_exact.py \
            --candidate-sha "$CANDIDATE_SHA" \
            --repo-root "$PWD" \
            --claims diag-238/combined.jsonl \
            --require-duckdb \
            --out diag-238/semantic-packet.json > diag-238/evaluate.log
          python3 tools/contract-modeling/bin/evaluate_exact.py \
            --candidate-sha "$CANDIDATE_SHA" \
            --repo-root "$PWD" \
            --claims diag-238/combined.jsonl \
            --require-duckdb \
            --out diag-238/semantic-packet-second.json > diag-238/evaluate-second.log
          cmp diag-238/semantic-packet.json diag-238/semantic-packet-second.json

      - name: Verify derived decisions and fail-closed boundary
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util, json, sys
          from pathlib import Path
          packet=json.loads(Path('diag-238/semantic-packet.json').read_text())
          expected={
            '238-01-control-loop-core':'create_new_model',
            '238-02-obligation':'extend_existing',
            '238-03-work-attempt':'extend_existing',
            '238-04-work-event':'extend_existing',
            '238-05-dispatch-projection':'add_projection',
            '238-06-claim-query':'add_query_contract',
            '238-07-result-receipt':'extend_existing',
            '238-08-observation':'extend_existing',
            '238-09-control-bundle':'extend_existing',
            '238-10-queue-migration-gap':'add_destructive_fixture',
            '238-11-authority-ambiguity':'quarantine',
            '238-13-semantic-gap':'add_semantic_term',
          }
          actual={r['request_id']:r['decision'] for r in packet['decisions'] if r['request_id'].startswith('238-')}
          assert actual==expected,(actual,expected)
          assert packet['authority'] is False
          assert packet['mode']=='shadow'
          assert packet['migration_complete'] is False
          assert packet['all_repositories_enforced'] is False
          assert packet['business_outcome_achieved'] is False
          assert packet['replay_equal'] is True
          assert packet['duckdb']['failures']==[]

          path=Path('tools/contract-modeling/bin/epoch.py')
          spec=importlib.util.spec_from_file_location('diag238_engine',path)
          module=importlib.util.module_from_spec(spec); sys.modules[spec.name]=module; spec.loader.exec_module(module)
          policy=module.read_json(Path('tools/contract-modeling/fixtures/accepted-policy.json'))
          rows=module.read_jsonl(Path('diag-238/combined.jsonl'))
          bad=dict(rows[0]); bad['id']='diag:unknown-obligation-kind'; bad['subject_key']='diag:unknown-obligation-kind'; bad['semantic_family']='graph'; bad['semantic_kind']='obligation'; bad['row_kind']='subject'; bad['payload']={'display_name':'obligation'}
          try:
              module.validate_and_reduce(rows+[bad],policy)
          except module.ContractError as exc:
              assert 'unknown semantic family/kind' in str(exc)
          else:
              raise AssertionError('native obligation kind was accepted')

          report={
            'kind':'governance.adrs238IssueModelingDiagnostic.v1',
            'status':'pass',
            'source':'roccho-dev/adrs#238 comments',
            'commentIds':[5010215539,5010217524,5010220937,5010222130,5010223536,5010225096],
            'sourceRows':68,
            'decisions':actual,
            'byteIdentical':True,
            'duckdbFailures':0,
            'nativeObligationKindAccepted':False,
            'authority':False,
            'migrationComplete':False,
            'businessOutcomeAchieved':False,
          }
          Path('diag-238/receipt.json').write_text(json.dumps(report,sort_keys=True,separators=(',',':'))+'\n')
          PY
          sha256sum diag-238/issue-238-live.jsonl diag-238/semantic-packet.json diag-238/receipt.json > diag-238/digests.txt

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adrs-238-issue-modeling-diagnostic
          path: diag-238/
          if-no-files-found: warn
