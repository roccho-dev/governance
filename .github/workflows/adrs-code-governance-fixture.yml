name: ADRS code governance fixture

on:
  workflow_call:
    inputs:
      governance_ref:
        description: Exact governance commit containing the reusable proof
        required: true
        type: string

permissions:
  contents: read
  issues: read

jobs:
  fixture:
    name: provider-detached read-only proof
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact governance implementation
        env:
          GOVERNANCE_REF: ${{ inputs.governance_ref }}
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/governance"
          git -C "$RUNNER_TEMP/governance" fetch --depth=1 https://github.com/roccho-dev/governance.git "$GOVERNANCE_REF"
          git -C "$RUNNER_TEMP/governance" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/governance" rev-parse HEAD)" = "$GOVERNANCE_REF"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-experimental-features = nix-command

      - name: Install pinned checker dependencies
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/governance"
          python3 -m pip install --disable-pip-version-check -r tools/code-governance/requirements.txt

      - name: Run live provider-detached proof
        env:
          ADRS_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          cd "$RUNNER_TEMP/governance"
          tools/code-governance/run-live-proof.sh 2>&1 | tee "$RUNNER_TEMP/code-governance-run.log"

      - name: Upload non-authority proof packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adrs-code-governance-fixture-proof
          path: |
            ${{ runner.temp }}/code-governance-run.log
            ${{ runner.temp }}/governance/tools/code-governance/out/proof-receipt.json
            ${{ runner.temp }}/governance/tools/code-governance/out/nix-output.json
            ${{ runner.temp }}/governance/tools/code-governance/out/tests.log
            ${{ runner.temp }}/governance/tools/code-governance/out/transports/live/transport-receipt.json
            ${{ runner.temp }}/governance/tools/code-governance/out/evaluations/live-local/
          if-no-files-found: warn
