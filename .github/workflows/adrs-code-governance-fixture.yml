name: ADRS code governance fixture

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - proposals

permissions:
  contents: read

concurrency:
  group: governance-adrs-code-governance-fixture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixture:
    name: provider-detached read-only proof
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout governance
        uses: actions/checkout@v4

      - name: Validate ADRS reader configuration
        env:
          ADRS_READER_CLIENT_ID: ${{ vars['ADRS_READER_CLIENT_ID'] }}
          ADRS_READER_PRIVATE_KEY: ${{ secrets['ADRS_READER_PRIVATE_KEY'] }}
        run: |
          set -euo pipefail
          test -n "$ADRS_READER_CLIENT_ID" || { echo "missing Actions variable: ADRS_READER_CLIENT_ID" >&2; exit 1; }
          test -n "$ADRS_READER_PRIVATE_KEY" || { echo "missing Actions secret: ADRS_READER_PRIVATE_KEY" >&2; exit 1; }

      - name: Create least-privilege ADRS issue-reader token
        id: adrs-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars['ADRS_READER_CLIENT_ID'] }}
          private-key: ${{ secrets['ADRS_READER_PRIVATE_KEY'] }}
          owner: roccho-dev
          repositories: adrs
          permission-issues: read

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-experimental-features = nix-command

      - name: Install pinned checker dependencies
        run: python3 -m pip install --disable-pip-version-check -r tools/code-governance/requirements.txt

      - name: Run live provider-detached proof
        env:
          ADRS_TOKEN: ${{ steps.adrs-token.outputs.token }}
        run: |
          set -o pipefail
          tools/code-governance/run-live-proof.sh 2>&1 | tee "$RUNNER_TEMP/code-governance-run.log"

      - name: Upload non-authority proof packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adrs-code-governance-fixture-proof
          path: |
            ${{ runner.temp }}/code-governance-run.log
            tools/code-governance/out/proof-receipt.json
            tools/code-governance/out/nix-output.json
            tools/code-governance/out/tests.log
            tools/code-governance/out/transports/live/transport-receipt.json
            tools/code-governance/out/evaluations/live-local/
          if-no-files-found: warn

  adrs-234-proof:
    name: exact ADRS 234 hosted proof
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Validate ADRS reader configuration
        env:
          ADRS_READER_CLIENT_ID: ${{ vars['ADRS_READER_CLIENT_ID'] }}
          ADRS_READER_PRIVATE_KEY: ${{ secrets['ADRS_READER_PRIVATE_KEY'] }}
        run: |
          set -euo pipefail
          test -n "$ADRS_READER_CLIENT_ID"
          test -n "$ADRS_READER_PRIVATE_KEY"

      - name: Create least-privilege ADRS contents token
        id: adrs-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars['ADRS_READER_CLIENT_ID'] }}
          private-key: ${{ secrets['ADRS_READER_PRIVATE_KEY'] }}
          owner: roccho-dev
          repositories: adrs
          permission-contents: read

      - name: Checkout exact ADRS candidate
        uses: actions/checkout@v4
        with:
          repository: roccho-dev/adrs
          ref: 2fb188b0d4f06efabb5823e60db4da92443cae84
          path: .ci/adrs-234
          token: ${{ steps.adrs-token.outputs.token }}
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-experimental-features = nix-command flakes

      - name: Run exact ADRS candidate proof
        run: |
          set -euo pipefail
          cd .ci/adrs-234
          test "$(git rev-parse HEAD)" = "2fb188b0d4f06efabb5823e60db4da92443cae84"
          nix flake check -L
          bash contract_modeling/v1/static-proof.sh
          first="$RUNNER_TEMP/adrs-234-first"
          second="$RUNNER_TEMP/adrs-234-second"
          python3 tools/check-recursive-contract-modeling-v1.py check --out "$first" >/dev/null
          python3 tools/check-recursive-contract-modeling-v1.py check --out "$second" >/dev/null
          cmp "$first/report.json" "$second/report.json"
          cmp "$first/receipt.json" "$second/receipt.json"
          cmp "$first/pass" "$second/pass"
          python3 tools/check-recursive-contract-modeling-v1.py selftest > "$RUNNER_TEMP/adrs-234-selftest.json"
          mkdir -p dist/recursive-contract-modeling-v1
          cp "$first/report.json" "$first/receipt.json" "$first/pass" \
             "$RUNNER_TEMP/adrs-234-selftest.json" dist/recursive-contract-modeling-v1/

      - name: Upload exact ADRS 234 diagnostic proof
        uses: actions/upload-artifact@v4
        with:
          name: exact-adrs-234-proof-2fb188b
          path: .ci/adrs-234/dist/recursive-contract-modeling-v1/*
          if-no-files-found: error
