name: contract-632-phase4

on:
  pull_request:
    paths:
      - '.github/workflows/contract-632-phase4.yml'
      - 'tools/package_contract_targets/**'
      - 'tools/package_contract_port_*.py'
      - 'tools/contract-modeling/tests/test_cold_contract_input.py'
      - 'tools/contract_632_*.py'
      - 'tools/check-package-contract-closure-bundle.py'
      - 'tools/check-package-final-scope-purpose-join.py'
      - 'tools/check-live-final-ci-consumers-provider.py'
      - 'tools/check-live-final-ci-consumers-current-provider.py'
      - 'tools/check-package-final-ci-production.py'

permissions:
  contents: read
  actions: read

concurrency:
  group: governance-contract-632-phase4-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  B0_RUN_ID: 38635268297
  B0_ARTIFACT_DIGEST: sha256:26aafdc00672b74219c95dd0cb05655a833fb8cb7b4d5f2e2feda667a2c89b38

jobs:
  selected-final-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact stacked input and discover targets
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$BASE_SHA" = 5b26984eb59e4c03f9d0fe34891fea5e4a436a16
          python3 tools/contract_632_phase4_acquire.py discover --out target-discovery.json
          jq -e '.kind=="governance.packageContractTargets.v1" and (.targets|index("ops"))!=null and (.targets|length)>0' target-discovery.json >/dev/null

      - name: Validate existing ADRS reader
        env:
          CLIENT_ID: ${{ vars['ADRS_READER_CLIENT_ID'] }}
          PRIVATE_KEY: ${{ secrets['ADRS_READER_PRIVATE_KEY'] }}
        run: test -n "$CLIENT_ID" && test -n "$PRIVATE_KEY"

      - id: adrs-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars['ADRS_READER_CLIENT_ID'] }}
          private-key: ${{ secrets['ADRS_READER_PRIVATE_KEY'] }}
          owner: roccho-dev
          repositories: adrs
          permission-contents: read

      - name: Retain fixed Cold data and independently pinned codec source
        uses: actions/checkout@v4
        with:
          repository: roccho-dev/adrs
          ref: a6284e58ed99243447e135828d983fc07d2d363e
          token: ${{ steps.adrs-token.outputs.token }}
          path: _cold/adrs
          persist-credentials: false
          fetch-depth: 0

      - name: Acquire every caller-owned exact source and fixed Apps shape roots
        env:
          SAME_REPO_TOKEN: ${{ github.token }}
          ADRS_READER_TOKEN: ${{ steps.adrs-token.outputs.token }}
        run: |
          set -euo pipefail
          python3 tools/contract_632_phase4_acquire.py acquire --out source-acquisition.json
          targets="$(jq '.targets|length' target-discovery.json)"
          expected="$((targets * 4 + 3))"
          jq -e --argjson expected "$expected" '.kind=="governance.packageContractSourceAcquisition.v2" and (.rows|length)==$expected' source-acquisition.json >/dev/null

      - name: Read exact existing Apps release bodies and prepare target evidence inputs
        run: |
          set -euo pipefail
          python3 tools/contract_632_phase4_acquire.py prepare

      - name: Prove cross-target port shape and exact Apps build readback
        id: preflight
        run: |
          set -euo pipefail
          python3 tools/check-package-contract-closure-bundle.py preflight \
            --preflight-target-source _preflight/target \
            --preflight-runtime-source _preflight/runtime \
            --preflight-accepted-source _preflight/accepted \
            --preflight-evidence-input _preflight/evidence \
            --out cross-target-preflight.json
          jq -e '.status=="pass" and .memberCreated==false and .targetRuntimeSeparated==true and .targetLocalComparatorPresent==false and .targetLocalLowerVerifierPresent==false and .lowerVerifierMayBeNone==true and .runtimeComparatorSelftest==true and .evidenceInputVerified==true and .evidenceInputFilesVerified==6 and .sourceOutputBytesEqual==true and .fullAssetBodyVerified==true and .fullAssetBytesVerified==62585992 and .fullMaterialFilesVerified==1 and .fullAssetMembersVerified==288 and .fullAssetTamper==true and .missingFullAsset==true' cross-target-preflight.json >/dev/null

      - name: Observe actual current providers and replay history separately
        id: provider
        continue-on-error: true
        env:
          CONSUMER_READER_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 tools/check-live-final-ci-consumers-current-provider.py selftest >/dev/null
          python3 tools/check-live-final-ci-consumers-current-provider.py capture --token-env CONSUMER_READER_TOKEN --out live-selected-consumers.json
          jq -e '.status=="pass" and .artifactBodiesVerified==true and .receiptCandidateShaBound==true and .observationMode=="actual-current-provider" and .historicalSnapshotsUsedForCurrent==false and all(.repositories[]; .artifactBodySource=="actual-current-provider-download" and .currentAcquisitionPath==null and .providerDigestMatchesDownload==true and .receiptCandidateShaBound==true)' live-selected-consumers.json >/dev/null

      - name: Produce and verify every discovered target through corrected Common
        id: package
        continue-on-error: true
        env:
          GOVERNANCE_CANDIDATE: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          for target in $(jq -r '.targets[]' target-discovery.json); do
            root="_sources/$target"
            candidate="$(jq -r '.targetSource.revision' "tools/package_contract_targets/$target.target.json")"
            bundle="contract-632-phase4-$target"
            common=(--target-id "$target" --bundle "$bundle" --target-source "$root/targetSource" --accepted-requirement-source "$root/acceptedRequirementSource" --governance-policy-source "$root/governancePolicySource" --contract-runtime-source "$root/contractRuntimeSource" --evidence-input "_evidence/$target" --governance-candidate "$GOVERNANCE_CANDIDATE")
            python3 tools/check-package-contract-closure-bundle.py produce "${common[@]}" > "target-produce-$target.json"
            python3 tools/check-package-contract-closure-bundle.py check "${common[@]}" --target-candidate "$candidate" --out "package-contract-member-$target.json" > "target-check-$target.json"
            jq -e --arg target "$target" --arg candidate "$candidate" --arg governance "$GOVERNANCE_CANDIDATE" '.kind=="governance.packageContractClosureMember.v3" and .targetId==$target and .targetCandidate==$candidate and .governanceCandidate==$governance and .status=="pass" and .contractDiffStatus=="CLOSED" and .remaining==0 and .contractRuntimeRepository=="roccho-org/ops" and .runtimeSourcesVerified==2 and .evidenceInputVerified==true' "package-contract-member-$target.json" >/dev/null
          done

      - name: Close fixed Cold records through the existing package final consumer
        id: cold
        continue-on-error: true
        env:
          GOVERNANCE_CANDIDATE: ${{ github.event.pull_request.head.sha }}
          COLD_INPUT_PROOF_CONFIG: cold-input-locations.json
          COLD_INPUT_PROOF_OUTPUT: cold-input-proof
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib
          records={
              'apps':('decisions/apps-voice-ui-artifact-auth-requirement-261015.jsonl','raw.adrs.apps_voice_ui_artifact_auth_requirement.261015.01','862313008ad19a743034599792d9a8b6e470e4cf'),
              'ops':('decisions/legacy-source-corpus-261008.jsonl','raw.adrs.import_proof.ci_topology_v1_contract_json.cdcc3b1c73d7','a8fc9e8e04d53f1d783317059e4421c8dc724d01'),
          }
          config={'coldRoot':str(pathlib.Path('_cold/adrs').resolve()),'codeRoot':str(pathlib.Path('_cold/adrs').resolve()),'coldRef':'HEAD','coldRevision':'a6284e58ed99243447e135828d983fc07d2d363e','governanceCandidate':os.environ['GOVERNANCE_CANDIDATE'],'targets':{}}
          for target,(path,record,accepted) in records.items():
              source=pathlib.Path('_sources')/target
              config['targets'][target]={'path':path,'recordId':record,'acceptedRevision':accepted,'bundle':str(pathlib.Path(f'contract-632-phase4-{target}').resolve()),'targetSource':str((source/'targetSource').resolve()),'acceptedSource':str((source/'acceptedRequirementSource').resolve()),'policySource':str((source/'governancePolicySource').resolve()),'runtimeSource':str((source/'contractRuntimeSource').resolve()),'evidenceInput':str((pathlib.Path('_evidence')/target).resolve())}
          pathlib.Path(os.environ['COLD_INPUT_PROOF_CONFIG']).write_text(json.dumps(config,sort_keys=True)+'\n')
          PY
          python3 tools/contract-modeling/tests/test_cold_contract_input.py -v
          jq -e '.failures==0 and .errors==0 and .skipped==0 and .testsRun>0 and .checkedTargets==["apps","ops"]' cold-input-proof/result.json >/dev/null

      - name: Acquire exact B0 provider artifact
        uses: actions/download-artifact@v4
        with:
          name: contract-632-phase4-governance-1422300f4b5706c860403f14966bfbba1f6ddc1a
          run-id: ${{ env.B0_RUN_ID }}
          github-token: ${{ github.token }}
          path: _b0

      - name: Prove B0 to corrected B1-prime value-level equivalence
        id: equivalence
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 tools/contract_632_b0_b1_prime.py --b0 _b0 --b1 contract-632-phase4-ops --member package-contract-member-ops.json --evidence-input _evidence/ops --out b0-b1-equivalence.json
          jq -e '.status=="pass" and .runtimeSeparated==true and .lowerProofPreservedForOps==true and .semanticInvariant==true and .stableByteInvariant==true and .expectedDeltaClosed==true and .negativeDeltaMapClosed==true and .manifestDeltaClosed==true and .evidenceInputBound==true and .memberEvidenceInputDigestDriftRejected==true and .memberEvidenceInputFilesDriftRejected==true and .memberEvidenceInputModeDriftRejected==true and .memberEvidenceExecutorDriftRejected==true' b0-b1-equivalence.json >/dev/null

      - name: Isolate acquired proof roots from canonical repository scans
        env:
          GOVERNANCE_CANDIDATE: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          proof_root="$RUNNER_TEMP/contract-632-proof-roots"
          rm -rf "$proof_root"
          mkdir -p "$proof_root"
          for root in _sources _preflight _evidence _b0 _cold cold-input-proof cold-input-locations.json; do mv "$root" "$proof_root/$root"; done
          proof_workflow="$proof_root/contract-632-phase4.yml"
          git show "$GOVERNANCE_CANDIDATE:.github/workflows/contract-632-phase4.yml" > "$proof_workflow"
          cmp "$proof_workflow" .github/workflows/contract-632-phase4.yml
          rm .github/workflows/contract-632-phase4.yml
          test "$(find .github/workflows -maxdepth 1 -type f | wc -l)" = 3
          echo "CONTRACT_632_PROOF_ROOT=$proof_root" >> "$GITHUB_ENV"

      - name: Consume every target through package-only and normal existing final entrances
        id: final
        continue-on-error: true
        env:
          GOVERNANCE_CANDIDATE: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          for target in $(jq -r '.targets[]' target-discovery.json); do
            root="$CONTRACT_632_PROOF_ROOT/_sources/$target"
            evidence="$CONTRACT_632_PROOF_ROOT/_evidence/$target"
            candidate="$(jq -r '.targetSource.revision' "tools/package_contract_targets/$target.target.json")"
            common=(--candidate-sha "$GOVERNANCE_CANDIDATE" --package-contract-bundle "contract-632-phase4-$target" --package-contract-target-source "$root/targetSource" --package-contract-accepted-requirement-source "$root/acceptedRequirementSource" --package-contract-governance-policy-source "$root/governancePolicySource" --package-contract-runtime-source "$root/contractRuntimeSource" --package-contract-evidence-input "$evidence" --package-contract-target-id "$target" --expected-target-candidate "$candidate")
            python3 tools/check-package-final-scope-purpose-join.py check-package "${common[@]}" --json > "package-final-report-$target.json"
            python3 tools/check-package-final-scope-purpose-join.py check "${common[@]}" --live-consumers live-selected-consumers.json --json > "final-check-report-$target.json"
            jq -e '.status=="pass" and .packageContractClosureDigest==.packageContractClosure.memberDigest' "package-final-report-$target.json" >/dev/null
            jq -e '.status=="pass" and .decision=="allow" and .releasePublished==false and .operationalAdoptionEffect==false and .packageContractClosureDigest==.packageContractClosure.memberDigest' "final-check-report-$target.json" >/dev/null
          done

      - name: Run destructive source, runtime, evidence, candidate, contract, provider, and legacy negatives
        id: negatives
        if: always()
        continue-on-error: true
        env:
          GOVERNANCE_CANDIDATE: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test -n "${CONTRACT_632_PROOF_ROOT:-}"
          test -d "$CONTRACT_632_PROOF_ROOT/_sources"
          test -d "$CONTRACT_632_PROOF_ROOT/_evidence"
          python3 tools/contract_632_phase4_negatives.py --bundle contract-632-phase4-ops --sources "$CONTRACT_632_PROOF_ROOT/_sources" --evidence "$CONTRACT_632_PROOF_ROOT/_evidence" --governance "$GOVERNANCE_CANDIDATE" --b0 "$CONTRACT_632_PROOF_ROOT/_b0" --out phase4-final-negative.json
          jq -e '.status=="pass" and .runtimeSourceTamper==true and .missingEvidenceInput==true and .wrongEvidenceCandidate==true and .wrongEvidenceOperation==true and .weakenedNegativeContract==true and .legacyMemberV2==true' phase4-final-negative.json >/dev/null

      - name: Write finite target-set readback and transport manifest
        if: always()
        env:
          GOVERNANCE_CANDIDATE: ${{ github.event.pull_request.head.sha }}
          PREFLIGHT: ${{ steps.preflight.outcome }}
          PROVIDER: ${{ steps.provider.outcome }}
          PACKAGE: ${{ steps.package.outcome }}
          COLD: ${{ steps.cold.outcome }}
          EQUIVALENCE: ${{ steps.equivalence.outcome }}
          FINAL: ${{ steps.final.outcome }}
          NEGATIVES: ${{ steps.negatives.outcome }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shutil
          root=pathlib.Path('contract-632-b1-prime-evidence'); root.mkdir(exist_ok=True)
          targets=json.loads(pathlib.Path('target-discovery.json').read_text())['targets']
          binding=sorted(p.name[:-len('.target.json')] for p in pathlib.Path('tools/package_contract_targets').glob('*.target.json'))
          adapters=sorted(p.stem for p in pathlib.Path('tools/package_contract_targets').glob('*.py') if p.name!='__init__.py')
          executed=sorted(p.name[len('package-contract-member-'):-len('.json')] for p in pathlib.Path('.').glob('package-contract-member-*.json'))
          artifacts=sorted(target for target in targets if pathlib.Path(f'contract-632-phase4-{target}').is_dir())
          for name in ('target-discovery.json','source-acquisition.json','cross-target-preflight.json','b0-b1-equivalence.json','phase4-final-negative.json','live-selected-consumers.json'):
              path=pathlib.Path(name)
              if path.exists(): shutil.copy2(path,root/name)
          proof_value=os.environ.get('CONTRACT_632_PROOF_ROOT')
          proof=pathlib.Path(proof_value) if proof_value else None
          preflight_full=False
          if proof:
              cold=proof/'cold-input-proof'
              if cold.exists(): shutil.copytree(cold,root/'cold-input-proof')
              preflight=proof/'_preflight/evidence'
              if preflight.exists(): shutil.copytree(preflight,root/'apps-preflight-evidence')
              preflight_material=proof/'_preflight/evidence-full'
              if preflight_material.exists():
                  shutil.copytree(preflight_material,root/'apps-preflight-full-material')
                  preflight_full=True
              workflow=proof/'contract-632-phase4.yml'
              if workflow.exists(): shutil.copy2(workflow,root/'proof-workflow.yml')
          members={}
          evidence_inputs={}
          evidence_targets=[]
          full_material_targets=[]
          for target in targets:
              bundle=pathlib.Path(f'contract-632-phase4-{target}')
              if bundle.exists(): shutil.copytree(bundle,root/f'{target}-bundle')
              for name in (f'package-contract-member-{target}.json',f'package-final-report-{target}.json',f'final-check-report-{target}.json',f'target-produce-{target}.json',f'target-check-{target}.json'):
                  path=pathlib.Path(name)
                  if path.exists(): shutil.copy2(path,root/name)
              producer=pathlib.Path(f'contract-632-phase4-{target}-producer')
              if producer.exists(): shutil.copytree(producer,root/producer.name)
              member_path=pathlib.Path(f'package-contract-member-{target}.json')
              member=json.loads(member_path.read_text()) if member_path.exists() else None
              if member: members[target]=member['memberDigest']
              evidence=proof/'_evidence'/target if proof else None
              if evidence and evidence.exists():
                  carried=root/'target-evidence'/target
                  carried.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copytree(evidence,carried)
                  paths=sorted(p.relative_to(carried).as_posix() for p in carried.rglob('*') if p.is_file())
                  body=json.loads((carried/'evidence.json').read_text())
                  identity={'mode':body['mode'],'digest':'sha256:'+hashlib.sha256((carried/'evidence.json').read_bytes()).hexdigest(),'filesVerified':len(paths),'executor':body['executor'],'paths':paths}
                  if member:
                      assert member['evidenceInputMode']==identity['mode']
                      assert member['evidenceInputDigest']==identity['digest']
                      assert member['evidenceInputFilesVerified']==identity['filesVerified']
                      assert member['evidenceExecutor']==identity['executor']
                  evidence_inputs[target]=identity
                  evidence_targets.append(target)
                  full=evidence.parent/f'{evidence.name}-full'
                  if full.exists():
                      destination=root/'target-full-material'/target
                      destination.parent.mkdir(parents=True,exist_ok=True)
                      shutil.copytree(full,destination)
                      full_material_targets.append(target)
          evidence_targets=sorted(evidence_targets)
          full_material_targets=sorted(full_material_targets)
          sets_closed=binding==adapters==targets==executed==artifacts==evidence_targets
          outcomes={name:os.environ[name] for name in ('PREFLIGHT','PROVIDER','PACKAGE','COLD','EQUIVALENCE','FINAL','NEGATIVES')}
          passed=sets_closed and preflight_full and all(value=='success' for value in outcomes.values())
          remaining=sum(v!='success' for v in outcomes.values())+(0 if sets_closed else 1)+(0 if preflight_full else 1)
          report={'kind':'governance.contract632.b1PrimeReadback.v2','status':'pass' if passed else 'fail','authority':False,'adoption':False,'releasePublished':False,'governanceCandidate':os.environ['GOVERNANCE_CANDIDATE'],'targets':targets,'bindingTargets':binding,'adapterTargets':adapters,'executedTargets':executed,'memberTargets':sorted(members),'artifactTargets':artifacts,'evidenceInputTargets':evidence_targets,'targetFullMaterialTargets':full_material_targets,'preflightFullMaterialTransported':preflight_full,'evidenceInputs':evidence_inputs,'targetSetsClosed':sets_closed,'memberDigests':members,'stageOutcomes':outcomes,'remaining':0 if passed else remaining,'claimCeiling':'B1_PRIME_PORT_SHAPE_NOT_APPS_ADAPTER_OR_EXTENSION_CLOSURE'}
          pathlib.Path('phase4-governance-readback.json').write_text(json.dumps(report,sort_keys=True,separators=(',',':'))+'\n')
          shutil.copy2('phase4-governance-readback.json',root/'phase4-governance-readback.json')
          rows=[{'path':p.relative_to(root).as_posix(),'sha256':'sha256:'+hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(root.rglob('*')) if p.is_file()]
          (root/'transport-manifest.json').write_text(json.dumps(rows,sort_keys=True,separators=(',',':'))+'\n')
          PY

      - name: Attempt provider archive transport
        if: always()
        id: upload
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: contract-632-b1-prime-${{ github.event.pull_request.head.sha }}
          path: contract-632-b1-prime-evidence/
          if-no-files-found: error
          retention-days: 90

      - name: Reduce exact result
        if: always()
        env:
          ARTIFACT_OUTCOME: ${{ steps.upload.outcome }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          cat phase4-governance-readback.json
          manifest_sha="$(sha256sum contract-632-b1-prime-evidence/transport-manifest.json | cut -d' ' -f1)"
          printf 'contract_632_b1_prime manifest=%s artifact_outcome=%s artifact_id=%s artifact_digest=%s\n' "$manifest_sha" "$ARTIFACT_OUTCOME" "${ARTIFACT_ID:-}" "${ARTIFACT_DIGEST:-}"
          jq -e '.status=="pass" and .remaining==0 and .targetSetsClosed==true and .preflightFullMaterialTransported==true and .evidenceInputTargets==.targets and all(.stageOutcomes[]; .=="success")' phase4-governance-readback.json >/dev/null
