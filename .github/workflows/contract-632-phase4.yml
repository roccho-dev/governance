name: contract-632-phase4

on:
  pull_request:
    paths:
      - '.github/workflows/contract-632-phase4.yml'
      - 'tools/package_contract_targets/**'
      - 'tools/package_contract_port_*.py'
      - 'tools/contract_632_*.py'
      - 'tools/check-package-contract-closure-bundle.py'
      - 'tools/check-package-final-scope-purpose-join.py'
      - 'tools/check-live-final-ci-consumers-provider.py'
      - 'tools/check-live-final-ci-consumers-current-provider.py'
      - 'tools/check-package-final-ci-production.py'

permissions:
  contents: read
  actions: read

concurrency:
  group: governance-contract-632-phase4-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  B0_RUN_ID: 38635268297
  B0_ARTIFACT_DIGEST: sha256:26aafdc00672b74219c95dd0cb05655a833fb8cb7b4d5f2e2feda667a2c89b38

jobs:
  selected-final-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact stacked input
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$BASE_SHA" = 1422300f4b5706c860403f14966bfbba1f6ddc1a
          python3 tools/contract_632_phase4_acquire.py discover --out target-discovery.json
          jq -e '.targets == ["ops"]' target-discovery.json >/dev/null

      - name: Validate existing ADRS reader
        env:
          CLIENT_ID: ${{ vars['ADRS_READER_CLIENT_ID'] }}
          PRIVATE_KEY: ${{ secrets['ADRS_READER_PRIVATE_KEY'] }}
        run: test -n "$CLIENT_ID" && test -n "$PRIVATE_KEY"

      - id: adrs-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars['ADRS_READER_CLIENT_ID'] }}
          private-key: ${{ secrets['ADRS_READER_PRIVATE_KEY'] }}
          owner: roccho-dev
          repositories: adrs
          permission-contents: read

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-experimental-features = nix-command flakes

      - name: Acquire target, runtime, policy, Requirement, and fixed Apps preflight sources
        env:
          SAME_REPO_TOKEN: ${{ github.token }}
          ADRS_READER_TOKEN: ${{ steps.adrs-token.outputs.token }}
        run: |
          set -euo pipefail
          python3 tools/contract_632_phase4_acquire.py acquire --out source-acquisition.json
          jq -e '.kind=="governance.packageContractSourceAcquisition.v2" and (.rows|length)==7' source-acquisition.json >/dev/null

      - name: Prove cross-target port shape and actual Apps build readback
        id: preflight
        run: |
          set -euo pipefail
          python3 tools/contract_632_phase4_acquire.py prepare
          python3 tools/check-package-contract-closure-bundle.py preflight \
            --preflight-target-source _preflight/target \
            --preflight-runtime-source _preflight/runtime \
            --preflight-accepted-source _preflight/accepted \
            --out cross-target-preflight.json
          jq -e '.status=="pass" and .targetRuntimeSeparated==true and .targetLocalComparatorPresent==false and .targetLocalLowerVerifierPresent==false and .lowerVerifierMayBeNone==true' cross-target-preflight.json >/dev/null
          jq -e '.kind=="governance.packageContractBuildReceipt.v1" and .targetId=="apps-shape-preflight" and .candidate=="71409fa013b6cb681c0a80b4c377e4685685b690" and .operation=="nix-build-voice-ui-dist" and .grade=="source" and .status=="PASS" and .readback=="PASS" and .sourceDigest==.outputDigest' _preflight/evidence/build-receipt.json >/dev/null

      - name: Observe actual current providers and replay history separately
        id: provider
        continue-on-error: true
        env:
          CONSUMER_READER_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 tools/check-live-final-ci-consumers-current-provider.py selftest >/dev/null
          python3 tools/check-live-final-ci-consumers-current-provider.py capture --token-env CONSUMER_READER_TOKEN --out live-selected-consumers.json
          jq -e '.status=="pass" and .artifactBodiesVerified==true and .receiptCandidateShaBound==true and .observationMode=="actual-current-provider" and .historicalSnapshotsUsedForCurrent==false and all(.repositories[]; .artifactBodySource=="actual-current-provider-download" and .currentAcquisitionPath==null and .providerDigestMatchesDownload==true and .receiptCandidateShaBound==true)' live-selected-consumers.json >/dev/null

      - name: Produce and verify every discovered target through corrected Common
        id: package
        env:
          GOVERNANCE_CANDIDATE: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          for target in $(jq -r '.targets[]' target-discovery.json); do
            root="_sources/$target"
            candidate="$(jq -r '.targetSource.revision' "tools/package_contract_targets/$target.target.json")"
            bundle="contract-632-phase4-$target"
            common=(--target-id "$target" --bundle "$bundle" --target-source "$root/targetSource" --accepted-requirement-source "$root/acceptedRequirementSource" --governance-policy-source "$root/governancePolicySource" --contract-runtime-source "$root/contractRuntimeSource" --evidence-input "_evidence/$target" --governance-candidate "$GOVERNANCE_CANDIDATE")
            python3 tools/check-package-contract-closure-bundle.py produce "${common[@]}" > "target-produce-$target.json"
            python3 tools/check-package-contract-closure-bundle.py check "${common[@]}" --target-candidate "$candidate" --out "package-contract-member-$target.json" > "target-check-$target.json"
            jq -e --arg target "$target" --arg candidate "$candidate" --arg governance "$GOVERNANCE_CANDIDATE" '.kind=="governance.packageContractClosureMember.v3" and .targetId==$target and .targetCandidate==$candidate and .governanceCandidate==$governance and .status=="pass" and .contractDiffStatus=="CLOSED" and .remaining==0 and .contractRuntimeRepository=="roccho-org/ops" and .runtimeSourcesVerified==2 and .lowerProofMode=="target-verifier+common-reconstruction"' "package-contract-member-$target.json" >/dev/null
          done

      - name: Acquire exact B0 provider artifact
        uses: actions/download-artifact@v4
        with:
          name: contract-632-phase4-governance-1422300f4b5706c860403f14966bfbba1f6ddc1a
          run-id: ${{ env.B0_RUN_ID }}
          github-token: ${{ github.token }}
          path: _b0

      - name: Prove B0 to corrected B1-prime equivalence
        id: equivalence
        run: |
          set -euo pipefail
          python3 tools/contract_632_b0_b1_prime.py \
            --b0 _b0 --b1 contract-632-phase4-ops \
            --member package-contract-member-ops.json \
            --out b0-b1-equivalence.json
          jq -e '.status=="pass" and .runtimeSeparated==true and .lowerProofPreservedForOps==true and .semanticInvariant==true and .stableByteInvariant==true and .expectedDeltaClosed==true' b0-b1-equivalence.json >/dev/null

      - name: Consume Ops through package-only and normal existing final entrances
        id: final
        env:
          GOVERNANCE_CANDIDATE: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          root="_sources/ops"
          common=(--candidate-sha "$GOVERNANCE_CANDIDATE" --package-contract-bundle contract-632-phase4-ops --package-contract-target-source "$root/targetSource" --package-contract-accepted-requirement-source "$root/acceptedRequirementSource" --package-contract-governance-policy-source "$root/governancePolicySource" --package-contract-target-id ops --expected-target-candidate 5eb98c82417b399978c1e38aebab5e3fb39752d4)
          python3 tools/check-package-final-scope-purpose-join.py check-package "${common[@]}" --json > package-final-report-ops.json
          python3 tools/check-package-final-scope-purpose-join.py check "${common[@]}" --live-consumers live-selected-consumers.json --json > final-check-report-ops.json
          jq -e '.status=="pass" and .packageContractClosureDigest==.packageContractClosure.memberDigest' package-final-report-ops.json >/dev/null
          jq -e '.status=="pass" and .decision=="allow" and .releasePublished==false and .operationalAdoptionEffect==false and .packageContractClosureDigest==.packageContractClosure.memberDigest' final-check-report-ops.json >/dev/null

      - name: Run destructive source, runtime, candidate, contract, provider, and legacy negatives
        id: negatives
        env:
          GOVERNANCE_CANDIDATE: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 tools/contract_632_phase4_negatives.py \
            --bundle contract-632-phase4-ops --sources _sources \
            --governance "$GOVERNANCE_CANDIDATE" --b0 _b0 \
            --out phase4-final-negative.json
          jq -e '.status=="pass" and .runtimeSourceTamper==true and .weakenedNegativeContract==true and .legacyMemberV2==true' phase4-final-negative.json >/dev/null

      - name: Write finite readback and transport manifest
        if: always()
        env:
          GOVERNANCE_CANDIDATE: ${{ github.event.pull_request.head.sha }}
          PREFLIGHT: ${{ steps.preflight.outcome }}
          PROVIDER: ${{ steps.provider.outcome }}
          PACKAGE: ${{ steps.package.outcome }}
          EQUIVALENCE: ${{ steps.equivalence.outcome }}
          FINAL: ${{ steps.final.outcome }}
          NEGATIVES: ${{ steps.negatives.outcome }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shutil
          root=pathlib.Path('contract-632-phase4-governance-evidence'); root.mkdir(exist_ok=True)
          for source,target in [
            ('contract-632-phase4-ops','ops-bundle'),('package-contract-member-ops.json','package-contract-member-ops.json'),
            ('package-final-report-ops.json','package-final-report-ops.json'),('final-check-report-ops.json','final-check-report-ops.json'),
            ('target-discovery.json','target-discovery.json'),('source-acquisition.json','source-acquisition.json'),
            ('cross-target-preflight.json','cross-target-preflight.json'),('b0-b1-equivalence.json','b0-b1-equivalence.json'),
            ('phase4-final-negative.json','phase4-final-negative.json'),('live-selected-consumers.json','live-selected-consumers.json')]:
              path=pathlib.Path(source)
              if path.is_dir(): shutil.copytree(path,root/target)
              elif path.exists(): shutil.copy2(path,root/target)
          if pathlib.Path('_preflight/evidence').exists(): shutil.copytree('_preflight/evidence',root/'apps-preflight-evidence')
          outcomes={name:os.environ[name] for name in ('PREFLIGHT','PROVIDER','PACKAGE','EQUIVALENCE','FINAL','NEGATIVES')}
          passed=all(value=='success' for value in outcomes.values())
          member=json.loads(pathlib.Path('package-contract-member-ops.json').read_text()) if pathlib.Path('package-contract-member-ops.json').exists() else {}
          report={'kind':'governance.contract632.b1PrimeReadback.v1','status':'pass' if passed else 'fail','authority':False,'adoption':False,'releasePublished':False,'governanceCandidate':os.environ['GOVERNANCE_CANDIDATE'],'targets':['ops'],'memberDigests':{'ops':member.get('memberDigest')},'stageOutcomes':outcomes,'remaining':0 if passed else sum(v!='success' for v in outcomes.values()),'claimCeiling':'B1_PRIME_PORT_SHAPE_NOT_APPS_ADAPTER_OR_EXTENSION_CLOSURE'}
          pathlib.Path('phase4-governance-readback.json').write_text(json.dumps(report,sort_keys=True,separators=(',',':'))+'\n'); shutil.copy2('phase4-governance-readback.json',root/'phase4-governance-readback.json')
          rows=[{'path':p.relative_to(root).as_posix(),'sha256':'sha256:'+hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(root.rglob('*')) if p.is_file()]
          (root/'transport-manifest.json').write_text(json.dumps(rows,sort_keys=True,separators=(',',':'))+'\n')
          PY

      - name: Attempt provider archive transport
        if: always()
        id: upload
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: contract-632-b1-prime-${{ github.event.pull_request.head.sha }}
          path: contract-632-phase4-governance-evidence/
          if-no-files-found: error
          retention-days: 90

      - name: Reduce exact result
        if: always()
        env:
          ARTIFACT_OUTCOME: ${{ steps.upload.outcome }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          cat phase4-governance-readback.json
          manifest_sha="$(sha256sum contract-632-phase4-governance-evidence/transport-manifest.json | cut -d' ' -f1)"
          printf 'contract_632_b1_prime manifest=%s artifact_outcome=%s artifact_id=%s artifact_digest=%s\n' "$manifest_sha" "$ARTIFACT_OUTCOME" "${ARTIFACT_ID:-}" "${ARTIFACT_DIGEST:-}"
          jq -e '.status=="pass" and .remaining==0 and all(.stageOutcomes[]; .=="success")' phase4-governance-readback.json >/dev/null
