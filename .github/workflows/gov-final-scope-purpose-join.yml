name: gov-final-scope-purpose-join

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [proposals]

permissions:
  actions: read
  contents: read

concurrency:
  group: governance-final-scope-purpose-join-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: accepted decision capture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Capture exact accepted decision projection
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          value=json.loads(Path('governance/accepted-final-ci-decision.v1.json').read_text())
          assert value['acceptedMerge']=='a8fc9e8e04d53f1d783317059e4421c8dc724d01'
          assert value['contractCanonicalDigest']=='8106d85404e636a9797dfb8e0a1f6343db8a7867ff904577f682e5d82ad9b314'
          assert value['stableRequiredCheck']=='gov-final-scope-purpose-join / gate'
          assert value['allRepositoriesEnforced'] is False
          Path('accepted-decision-capture.json').write_text(json.dumps(value,sort_keys=True,separators=(',',':'))+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: accepted-final-ci-decision
          path: accepted-decision-capture.json
          if-no-files-found: error

  source-capture:
    name: accepted and candidate ADRS source capture
    runs-on: ubuntu-latest
    steps:
      - name: Validate ADRS reader
        env:
          CLIENT_ID: ${{ vars['ADRS_READER_CLIENT_ID'] }}
          PRIVATE_KEY: ${{ secrets['ADRS_READER_PRIVATE_KEY'] }}
        run: test -n "$CLIENT_ID" && test -n "$PRIVATE_KEY"
      - id: adrs-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars['ADRS_READER_CLIENT_ID'] }}
          private-key: ${{ secrets['ADRS_READER_PRIVATE_KEY'] }}
          owner: roccho-dev
          repositories: adrs
          permission-contents: read
      - uses: actions/checkout@v4
        with:
          repository: roccho-dev/adrs
          ref: a8fc9e8e04d53f1d783317059e4421c8dc724d01
          path: accepted-adrs
          token: ${{ steps.adrs-token.outputs.token }}
          persist-credentials: false
      - name: Checkout exact ADRS 234 candidate
        uses: actions/checkout@v4
        with:
          repository: roccho-dev/adrs
          ref: c9d4d0afd0679adc2a49e40d5e9e90ca6fd8f068
          path: candidate-adrs
          token: ${{ steps.adrs-token.outputs.token }}
          persist-credentials: false
      - name: Checkout exact ADRS 223 publication correction merge
        uses: actions/checkout@v4
        with:
          repository: roccho-dev/adrs
          ref: b30c0750b4783f3349bc3c2d91e00853c90ab2ef
          path: publication-adrs
          token: ${{ steps.adrs-token.outputs.token }}
          persist-credentials: false
      - name: Verify and package ADRS sources
        env:
          PUBLICATION_ADRS_SHA: b30c0750b4783f3349bc3c2d91e00853c90ab2ef
        run: |
          set -euo pipefail
          test "$(git -C accepted-adrs rev-parse HEAD)" = a8fc9e8e04d53f1d783317059e4421c8dc724d01
          test "$(git -C candidate-adrs rev-parse HEAD)" = c9d4d0afd0679adc2a49e40d5e9e90ca6fd8f068
          test "$(git -C publication-adrs rev-parse HEAD)" = "$PUBLICATION_ADRS_SHA"
          python3 accepted-adrs/tools/check-final-organization-ci-topology-v1.py check \
            --contract accepted-adrs/ci_topology/v1/contract.json \
            --out "$RUNNER_TEMP/accepted-adrs-proof" >/dev/null
          python3 publication-adrs/tools/check-company-operating-contract-v0-publication.py selftest \
            > "$RUNNER_TEMP/company-contract-publication-selftest.json"
          python3 publication-adrs/tools/check-company-operating-contract-v0-publication.py check \
            --source-sha "$PUBLICATION_ADRS_SHA" \
            --out "$RUNNER_TEMP/company-contract-publication" \
            > "$RUNNER_TEMP/company-contract-publication-check.json"
          test -s "$RUNNER_TEMP/company-contract-publication/publication-manifest.json"
          test -s "$RUNNER_TEMP/company-contract-publication/publication-receipt.json"
          grep -q '"doubleRunByteIdentical":true' "$RUNNER_TEMP/company-contract-publication/publication-manifest.json"
          grep -q '"corporateSaleOutcomeAchieved":false' "$RUNNER_TEMP/company-contract-publication/publication-manifest.json"
          tar -C accepted-adrs --exclude=.git -czf accepted-adrs-source.tar.gz .
          tar -C candidate-adrs --exclude=.git -czf candidate-adrs-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: accepted-adrs-source
          path: accepted-adrs-source.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-adrs-234-source
          path: candidate-adrs-source.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: company-operating-contract-v0-publication
          path: |
            ${{ runner.temp }}/company-contract-publication-selftest.json
            ${{ runner.temp }}/company-contract-publication-check.json
            ${{ runner.temp }}/company-contract-publication/publication-manifest.json
            ${{ runner.temp }}/company-contract-publication/publication-receipt.json
            ${{ runner.temp }}/company-contract-publication/publication-pass
          if-no-files-found: error

  live-consumers:
    name: live selected consumer capture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Validate consumer reader configuration
        env:
          CLIENT_ID: ${{ vars['ADRS_READER_CLIENT_ID'] }}
          PRIVATE_KEY: ${{ secrets['ADRS_READER_PRIVATE_KEY'] }}
        run: test -n "$CLIENT_ID" && test -n "$PRIVATE_KEY"
      - name: Try read-only UI and Ops Actions token
        id: consumer-token
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars['ADRS_READER_CLIENT_ID'] }}
          private-key: ${{ secrets['ADRS_READER_PRIVATE_KEY'] }}
          owner: roccho-dev
          repositories: ui,ops
          permission-actions: read
          permission-contents: read
      - name: Run live consumer checker selftest
        run: python3 tools/check-live-final-ci-consumers.py selftest
      - name: Fetch current claims and receipt artifact bodies
        id: live-capture
        continue-on-error: true
        env:
          CONSUMER_READER_TOKEN: ${{ steps.consumer-token.outputs.token }}
        run: |
          set -o pipefail
          python3 tools/check-live-final-ci-consumers.py capture \
            --token-env CONSUMER_READER_TOKEN \
            --out live-selected-consumers.json \
            2>&1 | tee live-selected-consumers.log
      - name: Upload live diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-selected-consumers
          path: |
            live-selected-consumers.json
            live-selected-consumers.log
          if-no-files-found: warn
      - name: Reduce live packet
        env:
          OUTCOME: ${{ steps.live-capture.outcome }}
        run: |
          set -euo pipefail
          test "$OUTCOME" = success
          test -s live-selected-consumers.json
          grep -q '"status":"pass"' live-selected-consumers.json

  control-plane-observation:
    name: current control-plane diagnostic
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: python3 tools/check-live-final-ci-control-plane.py selftest
      - id: control-plane
        continue-on-error: true
        run: python3 tools/check-live-final-ci-control-plane.py check --out live-control-plane.json 2>&1 | tee live-control-plane.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-control-plane-diagnostic
          path: |
            live-control-plane.json
            live-control-plane.log
          if-no-files-found: warn

  regression:
    name: exact-candidate regression
    needs: source-capture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: accepted-adrs-source
          path: evidence
      - uses: actions/download-artifact@v4
        with:
          name: candidate-adrs-234-source
          path: evidence
      - name: Extract ADRS sources
        run: |
          set -euo pipefail
          mkdir -p evidence/accepted-adrs evidence/candidate-adrs
          tar -C evidence/accepted-adrs -xzf evidence/accepted-adrs-source.tar.gz
          tar -C evidence/candidate-adrs -xzf evidence/candidate-adrs-source.tar.gz
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
          cache: pip
          cache-dependency-path: tools/contract-modeling/requirements.txt
      - name: Install pinned contract-modeling dependencies
        run: python3 -m pip install --disable-pip-version-check -r tools/contract-modeling/requirements.txt
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: extra-experimental-features = nix-command flakes
      - name: Verify exact candidate
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Run Nix and ADRS candidate regression
        run: |
          set -euo pipefail
          nix flake check -L --no-write-lock-file \
            --override-input adrsRecords "path:$PWD/evidence/accepted-adrs" \
            --override-input uiLib "github:roccho-dev/ui/362f72d2a5be33dd8fcd96d6e1db1cfbe51d4579" \
            2>&1 | tee "$RUNNER_TEMP/final-ci-nix.log"
          nix flake check -L "path:$PWD/evidence/candidate-adrs" \
            2>&1 | tee "$RUNNER_TEMP/adrs-234-candidate.log"
          (
            cd evidence/candidate-adrs
            bash ci/check-recursive-contract-modeling-v1-static.sh
          ) 2>&1 | tee -a "$RUNNER_TEMP/adrs-234-candidate.log"
      - name: Run Python and contract-modeling regression
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          {
            python3 tools/compile-claim-port-joins.py selftest
            python3 tools/check-package-final-scope-purpose-join.py selftest --json
            python3 -m unittest discover -s tools/contract-modeling/tests -p 'test_*.py'
            CANDIDATE_SHA="$CANDIDATE_SHA" bash tools/contract-modeling/run-proof.sh
            cd evidence/candidate-adrs
            first="$RUNNER_TEMP/adrs-234-first"
            second="$RUNNER_TEMP/adrs-234-second"
            python3 tools/check-recursive-contract-modeling-v1.py check --out "$first" >/dev/null
            python3 tools/check-recursive-contract-modeling-v1.py check --out "$second" >/dev/null
            cmp "$first/report.json" "$second/report.json"
            cmp "$first/receipt.json" "$second/receipt.json"
            python3 tools/check-recursive-contract-modeling-v1.py selftest | tee "$RUNNER_TEMP/adrs-234-selftest.json"
          } 2>&1 | tee "$RUNNER_TEMP/final-ci-python.log"
      - name: Write regression receipt
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test -s tools/contract-modeling/out/selftest-receipt.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          selftest=json.loads(Path('tools/contract-modeling/out/selftest-receipt.json').read_text())
          assert selftest['status']=='pass'
          assert selftest['migration_complete'] is False
          receipt={
              'kind':'governance.regressionReceipt.v2',
              'status':'pass',
              'candidateSha':os.environ['CANDIDATE_SHA'],
              'authority':False,
              'contractModeling':{
                  'status':'shadow-pass',
                  'decisionId':'01K0E1CM000000000000000234',
                  'decisionDigest':'cc7ac3d6618b31eb0a0979b8aa0e2bfaf6abd95646e45c740d154c8204cd00d1',
                  'adrsHead':'c9d4d0afd0679adc2a49e40d5e9e90ca6fd8f068',
                  'migrationComplete':False,
              },
          }
          Path('regression-receipt.json').write_text(json.dumps(receipt,sort_keys=True,separators=(',',':'))+'\n')
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-ci-regression-diagnostics
          path: |
            ${{ runner.temp }}/final-ci-nix.log
            ${{ runner.temp }}/final-ci-python.log
            ${{ runner.temp }}/adrs-234-candidate.log
            ${{ runner.temp }}/adrs-234-selftest.json
            tools/contract-modeling/out/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: final-ci-regression
          path: regression-receipt.json
          if-no-files-found: error

  gate:
    name: gate
    needs: [capture, regression, live-consumers]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: accepted-final-ci-decision
          path: evidence/accepted-decision
      - uses: actions/download-artifact@v4
        with:
          name: final-ci-regression
          path: evidence/regression
      - uses: actions/download-artifact@v4
        with:
          name: live-selected-consumers
          path: evidence/live-consumers
      - name: Run final exact-SHA organization admission
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -s evidence/accepted-decision/accepted-decision-capture.json
          test -s evidence/regression/regression-receipt.json
          test -s evidence/live-consumers/live-selected-consumers.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          value=json.loads(Path('evidence/regression/regression-receipt.json').read_text())
          assert value['status']=='pass'
          assert value['contractModeling']['status']=='shadow-pass'
          assert value['contractModeling']['decisionDigest']=='cc7ac3d6618b31eb0a0979b8aa0e2bfaf6abd95646e45c740d154c8204cd00d1'
          assert value['contractModeling']['adrsHead']=='c9d4d0afd0679adc2a49e40d5e9e90ca6fd8f068'
          assert value['contractModeling']['migrationComplete'] is False
          PY
          python3 tools/check-package-final-scope-purpose-join.py check \
            --candidate-sha "$CANDIDATE_SHA" \
            --live-consumers evidence/live-consumers/live-selected-consumers.json \
            --json | tee final-gate-report.json
          grep -q '"productionAdmission":true' final-gate-report.json
          grep -q '"artifactBodiesVerified":true' final-gate-report.json
          grep -q '"receiptCandidateShaBound":true' final-gate-report.json
          grep -q '"allRepositoriesEnforced":false' final-gate-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: gov-final-gate-evidence
          path: |
            final-gate-report.json
            evidence/accepted-decision/accepted-decision-capture.json
            evidence/regression/regression-receipt.json
            evidence/live-consumers/live-selected-consumers.json
          if-no-files-found: error

  post-effect:
    name: post-effect readback
    if: github.event_name == 'push' && github.ref == 'refs/heads/proposals'
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf '{"kind":"governance.postEffectReadback.v1","status":"pass","repository":"roccho-dev/governance","branch":"proposals","writtenSha":"%s","observedSha":"%s","authority":false}\n' "$GITHUB_SHA" "$(git rev-parse HEAD)" > post-effect-readback.json
      - uses: actions/upload-artifact@v4
        with:
          name: gov-post-effect-readback
          path: post-effect-readback.json
          if-no-files-found: error
