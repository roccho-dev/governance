name: gov-final-scope-purpose-join

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - proposals

permissions:
  contents: read

concurrency:
  group: governance-final-scope-purpose-join-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout governance
        uses: actions/checkout@v4

      - name: Run final-scope purpose join gate adapter selftest
        run: python3 tools/check-package-final-scope-purpose-join.py selftest --json
