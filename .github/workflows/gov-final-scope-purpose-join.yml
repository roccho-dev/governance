name: gov-final-scope-purpose-join

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [proposals]

permissions:
  actions: read
  contents: read

concurrency:
  group: governance-final-scope-purpose-join-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: current decision and release identity capture
    runs-on: ubuntu-latest
    outputs:
      adrs_repository: ${{ steps.identity.outputs.adrs_repository }}
      adrs_head: ${{ steps.identity.outputs.adrs_head }}
      accepted_decision_digest: ${{ steps.identity.outputs.accepted_decision_digest }}
      contract_digest: ${{ steps.identity.outputs.contract_digest }}
      accepted_merge: ${{ steps.identity.outputs.accepted_merge }}
      stable_check_name: ${{ steps.identity.outputs.stable_check_name }}
      decision_status: ${{ steps.identity.outputs.decision_status }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Load the single exact identity projection
        id: identity
        run: python3 tools/gov_release/identity.py github-output >> "$GITHUB_OUTPUT"
      - name: Capture current projection and release candidate
        run: |
          set -euo pipefail
          python3 tools/gov_release/identity.py selftest
          python3 - <<'PY'
          import json
          from pathlib import Path
          current=json.loads(Path('governance/accepted-final-ci-decision.v1.json').read_text())
          baseline=json.loads(Path('governance/gov-release-baseline.v1.json').read_text())
          identity=json.loads(Path('governance/gov-release-identity.v1.json').read_text())
          assert current['acceptedMerge']==identity['currentTopology']['acceptedMerge']
          assert current['stableRequiredCheck']==identity['currentTopology']['stableCheckName']
          assert baseline['identityProjection']=='governance/gov-release-identity.v1.json'
          assert baseline['currentOperationalAdoption']['releasePublished'] is False
          assert baseline['invariants']['signatureRequired'] is False
          assert baseline['invariants']['allRepositoriesEnforced'] is False
          Path('decision-capture.json').write_text(json.dumps({'current':current,'govReleaseBaseline':baseline,'govReleaseIdentity':identity},sort_keys=True,separators=(',',':'))+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: accepted-final-ci-decision
          path: |
            decision-capture.json
            governance/gov-release-identity.v1.json
          if-no-files-found: error

  source-capture:
    name: accepted and candidate ADRS source capture
    needs: capture
    runs-on: ubuntu-latest
    steps:
      - name: Validate ADRS reader
        env:
          CLIENT_ID: ${{ vars['ADRS_READER_CLIENT_ID'] }}
          PRIVATE_KEY: ${{ secrets['ADRS_READER_PRIVATE_KEY'] }}
        run: test -n "$CLIENT_ID" && test -n "$PRIVATE_KEY"
      - id: adrs-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars['ADRS_READER_CLIENT_ID'] }}
          private-key: ${{ secrets['ADRS_READER_PRIVATE_KEY'] }}
          owner: roccho-dev
          repositories: adrs
          permission-contents: read
      - name: Checkout currently accepted ADRS topology
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.capture.outputs.adrs_repository }}
          ref: ${{ needs.capture.outputs.accepted_merge }}
          path: accepted-adrs
          token: ${{ steps.adrs-token.outputs.token }}
          persist-credentials: false
      - name: Checkout exact ADRS 234 candidate
        uses: actions/checkout@v4
        with:
          repository: roccho-dev/adrs
          ref: c9d4d0afd0679adc2a49e40d5e9e90ca6fd8f068
          path: candidate-adrs
          token: ${{ steps.adrs-token.outputs.token }}
          persist-credentials: false
      - name: Checkout exact ADRS 223 publication correction merge
        uses: actions/checkout@v4
        with:
          repository: roccho-dev/adrs
          ref: b30c0750b4783f3349bc3c2d91e00853c90ab2ef
          path: publication-adrs
          token: ${{ steps.adrs-token.outputs.token }}
          persist-credentials: false
      - name: Checkout exact gov-release ADRS correction
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.capture.outputs.adrs_repository }}
          ref: ${{ needs.capture.outputs.adrs_head }}
          path: release-adrs
          token: ${{ steps.adrs-token.outputs.token }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - name: Install CUE
        run: |
          go install cuelang.org/go/cmd/cue@v0.9.2
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - name: Verify exact ADRS sources
        env:
          ACCEPTED_MERGE: ${{ needs.capture.outputs.accepted_merge }}
          RELEASE_ADRS_HEAD: ${{ needs.capture.outputs.adrs_head }}
          ACCEPTED_DECISION_DIGEST: ${{ needs.capture.outputs.accepted_decision_digest }}
          CONTRACT_DIGEST: ${{ needs.capture.outputs.contract_digest }}
        run: |
          set -euo pipefail
          test "$(git -C accepted-adrs rev-parse HEAD)" = "$ACCEPTED_MERGE"
          test "$(git -C candidate-adrs rev-parse HEAD)" = c9d4d0afd0679adc2a49e40d5e9e90ca6fd8f068
          test "$(git -C publication-adrs rev-parse HEAD)" = b30c0750b4783f3349bc3c2d91e00853c90ab2ef
          test "$(git -C release-adrs rev-parse HEAD)" = "$RELEASE_ADRS_HEAD"
          python3 accepted-adrs/tools/check-final-organization-ci-topology-v1.py check \
            --contract accepted-adrs/ci_topology/v1/contract.json \
            --out "$RUNNER_TEMP/accepted-adrs-proof" >/dev/null
          python3 publication-adrs/tools/check-company-operating-contract-v0-publication.py selftest \
            > "$RUNNER_TEMP/company-contract-publication-selftest.json"
          python3 publication-adrs/tools/check-company-operating-contract-v0-publication.py check \
            --source-sha b30c0750b4783f3349bc3c2d91e00853c90ab2ef \
            --out "$RUNNER_TEMP/company-contract-publication" \
            > "$RUNNER_TEMP/company-contract-publication-check.json"
          (
            cd release-adrs
            cue vet adr/schema.cue adr/src/01KXNPWCS70N175PPHSQ4BSV1H-company-operating-contract-gov-release.cue
            cue vet adr/schema.cue adr/src/01KXBEYD56HE04FEJ7YMD5JZ9N-final-ci-gov-release-topology.cue
            python3 tools/check-gov-release-v1.py contract --out "$RUNNER_TEMP/gov-release-adrs-contract.json"
            python3 tools/check-gov-release-v1.py decision --out "$RUNNER_TEMP/gov-release-adrs-decision.json"
            python3 tools/check-gov-release-v1.py selftest --out "$RUNNER_TEMP/gov-release-adrs-selftest.json"
            bash ci/check-gov-release-v1-static.sh | tee "$RUNNER_TEMP/gov-release-adrs-static.log"
          )
          python3 - <<'PY'
          import json,os
          contract=json.load(open(os.environ['RUNNER_TEMP']+'/gov-release-adrs-contract.json'))
          decision=json.load(open(os.environ['RUNNER_TEMP']+'/gov-release-adrs-decision.json'))
          selftest=json.load(open(os.environ['RUNNER_TEMP']+'/gov-release-adrs-selftest.json'))
          assert contract['contractDigest']==os.environ['CONTRACT_DIGEST']
          assert decision['acceptedDecisionDigest']==os.environ['ACCEPTED_DECISION_DIGEST']
          assert selftest['destructiveCases']==18
          assert selftest['signatureRequired'] is False
          PY
          tar -C accepted-adrs --exclude=.git -czf accepted-adrs-source.tar.gz .
          tar -C candidate-adrs --exclude=.git -czf candidate-adrs-source.tar.gz .
          tar -C release-adrs --exclude=.git -czf release-adrs-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: accepted-adrs-source
          path: accepted-adrs-source.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-adrs-234-source
          path: candidate-adrs-source.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: gov-release-adrs-candidate
          path: |
            release-adrs-source.tar.gz
            ${{ runner.temp }}/gov-release-adrs-contract.json
            ${{ runner.temp }}/gov-release-adrs-decision.json
            ${{ runner.temp }}/gov-release-adrs-selftest.json
            ${{ runner.temp }}/gov-release-adrs-static.log
          if-no-files-found: error

  live-consumers:
    name: live selected consumer capture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Validate consumer reader configuration
        env:
          CLIENT_ID: ${{ vars['ADRS_READER_CLIENT_ID'] }}
          PRIVATE_KEY: ${{ secrets['ADRS_READER_PRIVATE_KEY'] }}
        run: test -n "$CLIENT_ID" && test -n "$PRIVATE_KEY"
      - name: Try read-only UI and Ops Actions token
        id: consumer-token
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars['ADRS_READER_CLIENT_ID'] }}
          private-key: ${{ secrets['ADRS_READER_PRIVATE_KEY'] }}
          owner: roccho-dev
          repositories: ui,ops
          permission-actions: read
          permission-contents: read
      - name: Run live consumer checker selftest
        run: python3 tools/check-live-final-ci-consumers.py selftest
      - name: Fetch current claims and receipt artifact bodies
        id: live-capture
        continue-on-error: true
        env:
          CONSUMER_READER_TOKEN: ${{ steps.consumer-token.outputs.token }}
        run: |
          set -o pipefail
          python3 tools/check-live-final-ci-consumers.py capture \
            --token-env CONSUMER_READER_TOKEN \
            --out live-selected-consumers.json \
            2>&1 | tee live-selected-consumers.log
      - name: Upload live diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-selected-consumers
          path: |
            live-selected-consumers.json
            live-selected-consumers.log
          if-no-files-found: warn
      - name: Reduce live packet
        env:
          OUTCOME: ${{ steps.live-capture.outcome }}
        run: |
          set -euo pipefail
          test "$OUTCOME" = success
          test -s live-selected-consumers.json
          grep -q '"status":"pass"' live-selected-consumers.json
          grep -q '"artifactBodiesVerified":true' live-selected-consumers.json
          grep -q '"receiptCandidateShaBound":true' live-selected-consumers.json

  control-plane-observation:
    name: informational control-plane diagnostic
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: python3 tools/check-live-final-ci-control-plane.py selftest
      - id: control-plane
        continue-on-error: true
        run: python3 tools/check-live-final-ci-control-plane.py check --out live-control-plane.json 2>&1 | tee live-control-plane.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-control-plane-diagnostic
          path: |
            live-control-plane.json
            live-control-plane.log
          if-no-files-found: warn

  regression:
    name: exact-candidate regression
    needs: source-capture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: accepted-adrs-source
          path: evidence
      - uses: actions/download-artifact@v4
        with:
          name: candidate-adrs-234-source
          path: evidence
      - name: Extract ADRS sources
        run: |
          set -euo pipefail
          mkdir -p evidence/accepted-adrs evidence/candidate-adrs
          tar -C evidence/accepted-adrs -xzf evidence/accepted-adrs-source.tar.gz
          tar -C evidence/candidate-adrs -xzf evidence/candidate-adrs-source.tar.gz
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
          cache: pip
          cache-dependency-path: tools/contract-modeling/requirements.txt
      - name: Install pinned dependencies
        run: python3 -m pip install --disable-pip-version-check -r tools/contract-modeling/requirements.txt
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: extra-experimental-features = nix-command flakes
      - name: Verify exact candidate
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Run Nix and ADRS candidate regression
        run: |
          set -euo pipefail
          nix flake check -L --no-write-lock-file \
            --override-input adrsRecords "path:$PWD/evidence/accepted-adrs" \
            --override-input uiLib "github:roccho-dev/ui/362f72d2a5be33dd8fcd96d6e1db1cfbe51d4579"
          nix flake check -L "path:$PWD/evidence/candidate-adrs"
          (cd evidence/candidate-adrs && bash ci/check-recursive-contract-modeling-v1-static.sh)
      - name: Run Python, contract-modeling, and gov release regression
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          {
            python3 tools/gov_release/identity.py selftest
            python3 tools/compile-claim-port-joins.py selftest
            python3 tools/check-package-final-scope-purpose-join.py selftest --json
            python3 -m unittest discover -s tools/contract-modeling/tests -p 'test_*.py'
            CANDIDATE_SHA="$CANDIDATE_SHA" bash tools/contract-modeling/run-proof.sh
            bash tools/gov_release/run-proof.sh | tee "$RUNNER_TEMP/gov-release-proof.json"
            cd evidence/candidate-adrs
            first="$RUNNER_TEMP/adrs-234-first"
            second="$RUNNER_TEMP/adrs-234-second"
            python3 tools/check-recursive-contract-modeling-v1.py check --out "$first" >/dev/null
            python3 tools/check-recursive-contract-modeling-v1.py check --out "$second" >/dev/null
            cmp "$first/report.json" "$second/report.json"
            cmp "$first/receipt.json" "$second/receipt.json"
            python3 tools/check-recursive-contract-modeling-v1.py selftest | tee "$RUNNER_TEMP/adrs-234-selftest.json"
          } 2>&1 | tee "$RUNNER_TEMP/final-ci-python.log"
      - name: Write regression receipt
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test -s tools/contract-modeling/out/selftest-receipt.json
          test -s "$RUNNER_TEMP/gov-release-proof.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          selftest=json.loads(Path('tools/contract-modeling/out/selftest-receipt.json').read_text())
          identity=json.loads(Path('governance/gov-release-identity.v1.json').read_text())
          assert selftest['status']=='pass'
          lines=Path(os.environ['RUNNER_TEMP'] + '/gov-release-proof.json').read_text().splitlines()
          release=[json.loads(line) for line in lines if line.startswith('{')][-1]
          assert release['status'] in {'pass','candidate-pass'}
          receipt={'kind':'governance.regressionReceipt.v6','status':'pass','candidateSha':os.environ['CANDIDATE_SHA'],'authority':False,'contractModeling':{'status':'pass','migrationComplete':selftest['migration_complete']},'govRelease':{'status':'candidate-pass','identityProjection':'governance/gov-release-identity.v1.json','contractDigest':identity['contract']['canonicalDigest'],'acceptedDecisionDigest':identity['acceptedDecision']['canonicalDigest'],'adrsHead':identity['source']['head'],'releasePublished':False,'operationalAdoptionEffect':False,'signatureRequired':False}}
          Path('regression-receipt.json').write_text(json.dumps(receipt,sort_keys=True,separators=(',',':'))+'\n')
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-ci-regression-diagnostics
          path: |
            ${{ runner.temp }}/final-ci-python.log
            ${{ runner.temp }}/adrs-234-selftest.json
            ${{ runner.temp }}/gov-release-proof.json
            tools/contract-modeling/out/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: final-ci-regression
          path: regression-receipt.json
          if-no-files-found: error

  gate:
    name: gate
    needs: [capture, regression, live-consumers]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: accepted-final-ci-decision
          path: evidence/accepted-decision
      - uses: actions/download-artifact@v4
        with:
          name: final-ci-regression
          path: evidence/regression
      - uses: actions/download-artifact@v4
        with:
          name: live-selected-consumers
          path: evidence/live-consumers
      - name: Run final exact-SHA release eligibility join
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -s evidence/accepted-decision/decision-capture.json
          test -s evidence/regression/regression-receipt.json
          test -s evidence/live-consumers/live-selected-consumers.json
          python3 tools/check-package-final-scope-purpose-join.py check \
            --candidate-sha "$CANDIDATE_SHA" \
            --live-consumers evidence/live-consumers/live-selected-consumers.json \
            --json | tee final-gate-report.json
          python3 - <<'PY'
          import json
          identity=json.load(open('governance/gov-release-identity.v1.json'))
          report=json.load(open('final-gate-report.json'))
          assert report['candidateEvidencePass'] is True
          assert report['artifactBodiesVerified'] is True
          assert report['receiptCandidateShaBound'] is True
          assert report['govReleaseEligibility']['releaseEligible'] is True
          assert report['releasePublished'] is False
          assert report['operationalAdoptionEffect'] is False
          assert report['govReleaseAcceptedDecisionDigest']==identity['acceptedDecision']['canonicalDigest']
          assert report['govReleaseContractDigest']==identity['contract']['canonicalDigest']
          assert report['govReleaseDecisionCandidateHead']==identity['source']['head']
          assert report['githubMergeHasCompanyAuthority'] is False
          assert report['signatureRequired'] is False
          assert report['allRepositoriesEnforced'] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gov-final-gate-evidence
          path: |
            final-gate-report.json
            governance/gov-release-identity.v1.json
            evidence/accepted-decision/decision-capture.json
            evidence/regression/regression-receipt.json
            evidence/live-consumers/live-selected-consumers.json
          if-no-files-found: error

  post-effect:
    name: transport-only merge readback
    if: github.event_name == 'push' && github.ref == 'refs/heads/proposals'
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf '{"kind":"governance.transportReadback.v2","status":"pass","repository":"roccho-dev/governance","branch":"proposals","writtenSha":"%s","observedSha":"%s","companyAdoptionEffect":false,"unreleasedCommitHasEffect":false,"authority":false}\n' "$GITHUB_SHA" "$(git rev-parse HEAD)" > post-effect-readback.json
      - uses: actions/upload-artifact@v4
        with:
          name: gov-post-effect-readback
          path: post-effect-readback.json
          if-no-files-found: error
