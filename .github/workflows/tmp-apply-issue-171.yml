name: temporary apply issue 171

on:
  pull_request:
    branches:
      - proposals

permissions:
  contents: read

jobs:
  apply:
    if: ${{ github.actor == github.repository_owner }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply deterministic issue 171 patch
        run: |
          set -euo pipefail
          python3 tools/gov_release/patch_issue_171.py
          python3 -m unittest discover -s tools/gov_release/tests -p 'test_*.py'
          test ! -e .github/workflows/tmp-apply-issue-171.yml
          test ! -e tools/gov_release/patch_issue_171.py
          test "$(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) | wc -l)" -eq 3
          mkdir -p patched/.github/workflows patched/tools
          cp .github/workflows/gov-release.yml patched/.github/workflows/gov-release.yml
          cp .github/workflows/gov-canary.yml patched/.github/workflows/gov-canary.yml
          cp tools/check-package-final-ci-production.py patched/tools/check-package-final-ci-production.py
          cp tools/check-package-ci-final-role-demotion.py patched/tools/check-package-ci-final-role-demotion.py
      - uses: actions/upload-artifact@v4
        with:
          name: issue-171-patched-files
          path: patched/
          if-no-files-found: error
